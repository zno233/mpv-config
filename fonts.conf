<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<fontconfig>

    <!-- 字体目录 -->
    <!-- mpv 专用字体目录（推荐把常用字体放这里） -->
    <dir>~/.config/mpv/fonts</dir>

    <!-- 用户字体目录 -->
    <dir>~/.local/share/fonts</dir>

    <!--
        核心逻辑：根据字幕需求加载字体
        1. ASS/SSA 字幕里 Style 的 Fontname（例如 "方正准圆简体"、"思源黑体 CN"、"DFPOP1-W5" 等）会直接去字体包里找对应 family，完全按字幕需求加载。
        2. 如果字幕没指定字体、或用了 sans-serif/serif/monospace 等通用名称，才走下面的 fallback。
        3. 这样既保证“字幕要什么就加载什么”，又避免中文字幕乱码。
    -->

    <!-- sans-serif(最常用)fallback -->
    <match target="pattern">
        <test qual="any" name="family"><string>sans-serif</string></test>
        <edit name="family" mode="assign" binding="same">
            <string>Source Han Sans CN</string>
        </edit>
    </match>

    <!-- serif fallback(少数字幕会用) -->
    <match target="pattern">
        <test qual="any" name="family"><string>serif</string></test>
        <edit name="family" mode="assign" binding="same">
            <string>Source Han Serif CN</string>
        </edit>
    </match>

    <!-- monospace fallback(代码字幕、英文字幕常用) -->
    <match target="pattern">
        <test qual="any" name="family"><string>monospace</string></test>
        <edit name="family" mode="assign" binding="same">
            <string>Source Han Sans CN</string>
        </edit>
    </match>

    <!--
        可选增强：让字体包里的字体优先级更高(防止系统自带字体抢占)
        如果你发现某些字体被系统字体覆盖，取消下面整段的注释即可启用。

        <match target="pattern">
            <test qual="any" name="family">
                <string>Source Han Sans CN</string>
                <string>Source Han Serif CN</string>
            </test>
            <edit name="family" mode="prepend" binding="same">
                <string>Source Han Sans CN</string>
            </edit>
        </match>
    -->

</fontconfig>
