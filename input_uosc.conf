### 文档_ https://github.com/hooke007/MPV_lazy/blob/main/portable_config/input.conf
### 文档_ https://github.com/hooke007/MPV_lazy/blob/main/portable_config/input_uosc.conf

########
# 加载 #
########

 HOME              script-binding recentmenu/open                        #menu: 打开 > 近期播放 #@recent
 INS               script-binding uosc/open-file                         #! 加载 > ※ 文件浏览器
 Ctrl+Shift+v      loadfile ${clipboard/text}                            #! 加载 > 剪贴板URL

########
# 导航 #
########

#                  script-binding uosc/playlist                          #! 导航 > ※ 播放列表
#                  script-binding uosc/editions                          #! 导航 > ※ 版本列表
#                  script-binding uosc/chapters                          #! 导航 > ※ 章节列表
#                  script-binding uosc/video                             #! 导航 > ※ 视频轨列表
#                  script-binding uosc/audio                             #! 导航 > ※ 音频轨列表
#                  script-binding uosc/subtitles                         #! 导航 > ※ 字幕轨列表
#                  playlist-shuffle                                      #! 导航 > 播放列表乱序重排
 Ctrl+Left         add chapter -1                                        #! 导航 > 上一章节
 Ctrl+Right        add chapter  1                                        #! 导航 > 下一章节

########
# 播放 #
########

 ,                 frame-back-step                                      #! 播放 > 上一帧
 .                 frame-step                                           #! 播放 > 下一帧
 l                 ab-loop                                              #! 播放 > 设置/清除 AB循环点

 ## 速度
 [                 no-osd cycle-values speed 2 1.5 1.2 1 ; script-message-to uosc flash-elements speed   #! 播放 > 切换 速度 -
 ]                 no-osd cycle-values speed 1 1.2 1.5 2 ; script-message-to uosc flash-elements speed   #! 播放 > 切换 速度 +
 {                 no-osd add speed -0.1 ; script-message-to uosc flash-elements speed   #! 播放 > 切换 速度 -0.1
 }                 no-osd add speed  0.1 ; script-message-to uosc flash-elements speed   #! 播放 > 切换 速度 +0.1

 ## 音量
 -                 no-osd add volume -1 ; script-message-to uosc flash-elements volume   #! 播放 > 音量 -
 =                 no-osd add volume  1 ; script-message-to uosc flash-elements volume   #! 播放 > 音量 +

 ## 音频/字幕同步
 c                 add audio-delay -0.1                                 #! 播放 > 音频预载 100ms
 v                 add audio-delay  0.1                                 #! 播放 > 音频延迟 100ms
 z                 add sub-delay -0.1                                   #! 播放 > 字幕预载 100ms
 x                 add sub-delay +0.1                                   #! 播放 > 字幕延迟 100ms
 Shift+BS          set audio-delay 0 ; set sub-delay 0                  #! 播放 > 重置 音频与字幕同步

 ## ASS 样式
 o                 cycle_values sub-ass-override no yes                 #! 播放 > 切换 ASS 样式覆盖

########
# 滤镜 #
########

 ## VF 滤镜（VapourSynth 补帧）
 ~                 vf clr ""                                            #! VF 滤镜 > 清空
 !                 vf set vapoursynth="~~/vs/MEMC_MVT_LQ.vpy"           #! VF 滤镜 > 预设 补帧 MVTools_快速
 @                 vf set vapoursynth="~~/vs/MEMC_MVT_STD.vpy"          #! VF 滤镜 > 预设 补帧 MVTools_标准
 SHARP             vf set vapoursynth="~~/vs/MEMC_RIFE_DML.vpy"         #! VF 滤镜 > 预设 补帧 RIFE_DX12
 $                 vf set vapoursynth="~~/vs/MEMC_RIFE_NV.vpy"          #! VF 滤镜 > 预设 补帧 RIFE_RTX (DLC-vsNV)
 %                 vf set vapoursynth="~~/vs/MIX_UAI_DML.vpy"           #! VF 滤镜 > 预设 自定义AI UAI_DX12
 ^                 vf set vapoursynth="~~/vs/MIX_UAI_NV_TRT.vpy"        #! VF 滤镜 > 预设 自定义AI UAI_RTX (DLC-vsNV)

 ## GLSL 着色器（清空）
 Ctrl+`            change-list glsl-shaders clr ""                       #! 着色器 > 清空

 ## GLSL 着色器（预设组合）
 #  Anime4K Mode A： Restore_CNN_M + Upscale_CNN_x2_M + AutoDownscale + Upscale_CNN_x2_S
 #                  change-list glsl-shaders clr ""; change-list glsl-shaders append "~~/shaders/Anime4K/glsl/Restore/Anime4K_Clamp_Highlights.glsl"; change-list glsl-shaders append "~~/shaders/Anime4K/glsl/Restore/Anime4K_Restore_CNN_M.glsl"; change-list glsl-shaders append "~~/shaders/Anime4K/glsl/Upscale/Anime4K_Upscale_CNN_x2_M.glsl"; change-list glsl-shaders append "~~/shaders/Anime4K/glsl/Upscale/Anime4K_AutoDownscalePre_x2.glsl"; change-list glsl-shaders append "~~/shaders/Anime4K/glsl/Upscale/Anime4K_AutoDownscalePre_x4.glsl"; change-list glsl-shaders append "~~/shaders/Anime4K/glsl/Upscale/Anime4K_Upscale_CNN_x2_S.glsl"; show-text "Anime4K: Mode A (Fast)"  #menu: 着色器 > A4K (Fast) > A4K Mode A (Fast)
 #  Anime4K Mode B： Restore_CNN_Soft_M + Upscale_CNN_x2_M + AutoDownscale + Upscale_CNN_x2_S
 #                  change-list glsl-shaders clr ""; change-list glsl-shaders append "~~/shaders/Anime4K/glsl/Restore/Anime4K_Clamp_Highlights.glsl"; change-list glsl-shaders append "~~/shaders/Anime4K/glsl/Restore/Anime4K_Restore_CNN_Soft_M.glsl"; change-list glsl-shaders append "~~/shaders/Anime4K/glsl/Upscale/Anime4K_Upscale_CNN_x2_M.glsl"; change-list glsl-shaders append "~~/shaders/Anime4K/glsl/Upscale/Anime4K_AutoDownscalePre_x2.glsl"; change-list glsl-shaders append "~~/shaders/Anime4K/glsl/Upscale/Anime4K_AutoDownscalePre_x4.glsl"; change-list glsl-shaders append "~~/shaders/Anime4K/glsl/Upscale/Anime4K_Upscale_CNN_x2_S.glsl"; show-text "Anime4K: Mode B (Fast)"  #menu: 着色器 > A4K (Fast) > A4K Mode B (Fast)
 #  Anime4K DTDD： Darken_HQ + Thin_HQ + Denoise_Bilateral + Deblur_DoG
 #                  change-list glsl-shaders clr ""; change-list glsl-shaders append "~~/shaders/Anime4K/glsl/Experimental-Effects/Anime4K_Darken_HQ.glsl"; change-list glsl-shaders append "~~/shaders/Anime4K/glsl/Experimental-Effects/Anime4K_Thin_HQ.glsl"; change-list glsl-shaders append "~~/shaders/Anime4K/glsl/Denoise/Anime4K_Denoise_Bilateral_Mode.glsl"; change-list glsl-shaders append "~~/shaders/Anime4K/glsl/Deblur/Anime4K_Deblur_DoG.glsl"; show-text "Anime4K: DTDD";  #menu: 着色器 > A4K-DTDD

 ## GLSL 着色器（单独开关）
 Ctrl+1            change-list glsl-shaders toggle "~~/shaders/Ani4k/Ani4Kv2_ArtCNN_C4F32_i2.glsl"    #! 着色器 > 开关 LUMA: Ani4Kv2
 Ctrl+2            change-list glsl-shaders toggle "~~/shaders/Ani4k/AniSD_ArtCNN_C4F32_i4.glsl"      #! 着色器 > 开关 LUMA: AniSD
 Ctrl+3            change-list glsl-shaders toggle "~~/shaders/igv/FSRCNNX_x2_16-0-4-1.glsl"          #! 着色器 > 开关 LUMA: FSRCNNX
 Ctrl+4            change-list glsl-shaders toggle "~~/shaders/nnedi3/nnedi3-nns128-win8x4.glsl"       #! 着色器 > 开关 LUMA: NNEDI3
 Ctrl+5            change-list glsl-shaders toggle "~~/shaders/other/AMD_FSR_EASU_rgb_RT.glsl"         #! 着色器 > 开关 MAIN: FSR_EASU RT (*)
 Ctrl+6            change-list glsl-shaders toggle "~~/shaders/Anime4K/glsl/Restore/Anime4K_Restore_CNN_L.glsl"    #! 着色器 > 开关 MAIN: A4K_重建
 Ctrl+7            change-list glsl-shaders toggle "~~/shaders/Anime4K/glsl/Upscale/Anime4K_Upscale_GAN_x2_M.glsl" #! 着色器 > 开关 MAIN: A4K_放大
 Ctrl+8            change-list glsl-shaders toggle "~~/shaders/other/Anime4K_AIO_optQ.glsl"            #! 着色器 > 开关 MAIN: A4K_配置Q
 Ctrl+9            change-list glsl-shaders toggle "~~/shaders/igv/adaptive-sharpen.glsl"              #! 着色器 > 开关 SCALED: 自适应锐化

########
# 视频 #
########

## 解码与画质切换
#                  cycle-values hwdec "auto" "auto-copy" "no"            #! 视频 > 切换 解码模式
#                  cycle deband                                          #! 视频 > 切换 去色带状态
#                  cycle deinterlace                                     #! 视频 > 切换 去隔行状态
#                  cycle icc-profile-auto                                #! 视频 > 切换 自动校色
#                  cycle correct-pts                                     #! 视频 > 切换 时间码解析模式

## 均衡器
 1                 add contrast -1                                       #! 视频 > 均衡器 > 对比度 -
 2                 add contrast  1                                       #! 视频 > 均衡器 > 对比度 +
 3                 add brightness -1                                     #! 视频 > 均衡器 > 亮度/明度 -
 4                 add brightness  1                                     #! 视频 > 均衡器 > 亮度/明度 +
 5                 add gamma -1                                          #! 视频 > 均衡器 > 伽马 -
 6                 add gamma  1                                          #! 视频 > 均衡器 > 伽马 +
 7                 add saturation -1                                     #! 视频 > 均衡器 > 饱和度/纯度 -
 8                 add saturation  1                                     #! 视频 > 均衡器 > 饱和度/纯度 +
 9                 add hue -1                                            #! 视频 > 均衡器 > 色相 -
 0                 add hue  1                                            #! 视频 > 均衡器 > 色相 +
 Ctrl+BS           set contrast 0 ; set brightness 0 ; set gamma 0 ; set saturation 0 ; set hue 0   #! 视频 > 均衡器 > 重置 全部

########
# 字幕 #
########

#                  script-binding uosc/load-subtitles                    #! 字幕 > ※ 导入 字幕轨
CTRL+f             script-message-to sub_assrt sub-assrt                #! 字幕 > 打开 字幕下载菜单
ALT+m              script-message-to sub_export export-selected-subtitles   #! 字幕 > 导出当前内封字幕
ALT+f              script-message-to sub_fastwhisper sub-fastwhisper    #! 字幕 > 生成 AI 字幕

########
# 工具 #
########

 Ctrl+i            script-binding uosc/keybinds                         #! 工具 > ※ 按键绑定列表
 TAB               script-binding display-stats-toggle                  #! 工具 > 常驻显示统计信息
 `                 script-binding commands/open                         #! 工具 > 显示OSD命令行（控制台）
 Ctrl+r            script-message-to save_global_props clean_data       #! 工具 > 清除已记录的属性值
#                  cycle border                                         #! 工具 > 切换 窗口边框
 t                 cycle ontop                                          #! 工具 > 切换 窗口置顶
#                  script-binding uosc/audio-device                     #! 工具 > ※ 音频输出设备列表
#                  script-binding uosc/stream-quality                   #! 工具 > ※ 流式传输品质
#                  script-binding uosc/show-in-directory                #! 工具 > ※ 打开 当前文件所在路径
#                  script-binding uosc/open-config-directory            #! 工具 > ※ 打开 设置目录

########
# 截图 #
########

 Ctrl+s            screenshot subtitles                                 #menu: 截屏 > 源分辨率尺寸（带字幕OSD）
 Ctrl+x            screenshot video                                     #menu: 截屏 > 源分辨率尺寸（无字幕OSD）
 Ctrl+c            screenshot window                                    #menu: 截屏 > 实际窗口尺寸

########
# 退出 #
########

#                  stop                                                 #! 停止
 Ctrl+q            quit                                                 #! 退出mpv

### ====================== 不映射菜单 ======================

 POWER             quit                                                  # 退出
 PLAY              set pause no                                          # 暂停
 PAUSE             set pause yes                                         # 播放
 PLAYPAUSE         cycle pause                                           # 暂停/播放
 STOP              stop                                                  # 停止
 REWIND            seek -30 ; script-message-to uosc flash-elements timeline   # 向前跳转30秒，刷新uosc进度条
 FORWARD           seek  30 ; script-message-to uosc flash-elements timeline   # 向后跳转30秒，刷新uosc进度条
 PGUP              script-binding uosc/prev                              # uosc跳转上一个文件
 PGDWN             script-binding uosc/next                              # uosc跳转下一个文件

 MBTN_BACK         script-binding uosc/prev
 MBTN_FORWARD      script-binding uosc/next
 MBTN_LEFT         ignore
 MBTN_LEFT_DBL     cycle fullscreen                                      # 全屏/窗口
 MBTN_MID          script-binding uosc/menu                              # 打开uosc菜单
 MBTN_RIGHT        script-binding uosc/menu
 Ctrl+MBTN_RIGHT   context-menu                                          # 打开原生菜单
 MBTN_RIGHT_DBL    ignore
 WHEEL_DOWN        no-osd add volume -1 ; script-message-to uosc flash-elements volume   # 音量降低，刷新uosc音量条
 WHEEL_UP          no-osd add volume  1 ; script-message-to uosc flash-elements volume   # 音量升高，刷新uosc音量条

 ESC               set fullscreen no                                      # 窗口
 ENTER             set fullscreen yes                                     # 全屏
 kp_ENTER          set fullscreen yes                                     # 全屏
 Alt+ENTER         cycle fullscreen
 SPACE             cycle pause
 UP                set pause yes ; seek -1 exact ; script-message-to uosc flash-elements timeline   # 暂停，向前精确跳转1秒，刷新uosc进度条
 DOWN              set pause yes ; seek  1 exact ; script-message-to uosc flash-elements timeline   # 暂停，向后精确跳转1秒，刷新uosc进度条
 LEFT              seek -5 exact ; script-message-to uosc flash-elements timeline
 RIGHT             seek  5 exact ; script-message-to uosc flash-elements timeline
 Ctrl+UP           script-binding uosc/prev
 Ctrl+DOWN         script-binding uosc/next
 Alt+MBTN_LEFT     script-binding positioning/drag-to-pan                 # 移动画面
 BS                no-osd set video-zoom 0 ; no-osd set panscan 0 ; no-osd set video-pan-x 0 ; no-osd set video-pan-y 0 ; no-osd set video-align-x 0 ; no-osd set video-align-y 0 ; show-text "重置 --video-zoom --panscan --video-pan --video-align"
 Alt+WHEEL_DOWN    script-binding positioning/cursor-centric-zoom -0.1    # 缩小画面
 Alt+WHEEL_UP      script-binding positioning/cursor-centric-zoom  0.1    # 放大画面
 g                 ignore
 g-m               script-binding select/menu                             # 打开select菜单
 MBTN_LEFT         cycle pause                                            # 暂停
