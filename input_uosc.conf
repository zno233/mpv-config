### 文档_ https://github.com/hooke007/MPV_lazy/blob/main/portable_config/input.conf
### 文档_ https://github.com/hooke007/MPV_lazy/blob/main/portable_config/input_uosc.conf
###
### 格式说明：
### 第一列   键位，# 在这为占位符
### 第二列   mpv原生命令或者lua脚本添加的命令
### 第三列   #! 映射到菜单， # 不映射到菜单

########
# 加载 #
########

HOME               script-binding recentmenu/open                        #! 加载 > 近期播放 #@recent
INS                script-binding uosc/open-file                         #! 加载 > 文件浏览器
Ctrl+Shift+v       loadfile ${clipboard/text}                            #! 加载 > 剪贴板URL

########
# 导航 #
########

## 轨道
#                  script-binding uosc/video                             #! 导航 > 轨道 > 视频轨
#                  script-binding uosc/audio                             #! 导航 > 轨道 > 音频轨
#                  script-binding uosc/subtitles                         #! 导航 > 轨道 > 字幕轨
#                  script-binding uosc/editions                          #! 导航 > 轨道 > 版本列表

## 列表
#                  script-binding uosc/playlist                          #! 导航 > 列表 > 播放列表
#                  script-binding uosc/chapters                          #! 导航 > 列表 > 章节列表
#                  playlist-shuffle                                      #! 导航 > 列表 > 播放列表乱序

## 跳转
Ctrl+Left          add chapter -1                                        #! 导航 > 跳转 > 上一章节
Ctrl+Right         add chapter  1                                        #! 导航 > 跳转 > 下一章节

########
# 播放 #
########

SPACE              cycle pause                                           #! 播放 > 暂停/播放
,                  frame-back-step                                       #! 播放 > 上一帧
.                  frame-step                                            #! 播放 > 下一帧
l                  ab-loop                                               #! 播放 > AB循环
[                  no-osd cycle-values speed 2 1.5 1.2 1                 #! 播放 > 速度 > 速度降低
]                  no-osd cycle-values speed 1 1.2 1.5 2                 #! 播放 > 速度 > 速度升高
{                  no-osd add speed -0.1                                 #! 播放 > 速度 > 速度 -0.1
}                  no-osd add speed  0.1                                 #! 播放 > 速度 > 速度 +0.1
-                  no-osd add volume -1                                  #! 播放 > 音量 > 音量降低
=                  no-osd add volume  1                                  #! 播放 > 音量 > 音量升高
c                  add audio-delay -0.1                                  #! 播放 > 同步 > 音频预载
v                  add audio-delay  0.1                                  #! 播放 > 同步 > 音频延迟
z                  add sub-delay -0.1                                    #! 播放 > 同步 > 字幕预载
x                  add sub-delay +0.1                                    #! 播放 > 同步 > 字幕延迟
Shift+BS           set audio-delay 0 ; set sub-delay 0                   #! 播放 > 同步 > 同步重置

## 均衡器
1                  add contrast -1                                       #! 播放 > 均衡器 > 对比度 -
2                  add contrast  1                                       #! 播放 > 均衡器 > 对比度 +
3                  add brightness -1                                     #! 播放 > 均衡器 > 亮度 -
4                  add brightness  1                                     #! 播放 > 均衡器 > 亮度 +
5                  add gamma -1                                          #! 播放 > 均衡器 > 伽马 -
6                  add gamma  1                                          #! 播放 > 均衡器 > 伽马 +
7                  add saturation -1                                     #! 播放 > 均衡器 > 饱和度 -
8                  add saturation  1                                     #! 播放 > 均衡器 > 饱和度 +
9                  add hue -1                                            #! 播放 > 均衡器 > 色相 -
0                  add hue  1                                            #! 播放 > 均衡器 > 色相 +
Ctrl+BS            set contrast 0 ; set brightness 0 ; set gamma 0 ; set saturation 0 ; set hue 0   #! 播放 > 均衡器 > 重置

########
# 视频 #
########

## 解码
#                  cycle-values hwdec "auto" "auto-copy" "no"            #! 视频 > 解码 > 切换模式
#                  cycle deinterlace                                     #! 视频 > 解码 > 去隔行
#                  cycle deband                                          #! 视频 > 解码 > 去色带
#                  cycle icc-profile-auto                                #! 视频 > 解码 > 自动校色
#                  cycle correct-pts                                     #! 视频 > 解码 > 时间码解析

## 画质
Ctrl+Shift+g       script-message-to input_plus cycle-cmds "apply-profile Deband-Low" "apply-profile Deband-Low restore"    #! 视频 > 画质 > 去色带 low
Ctrl+Shift+f       script-message-to input_plus cycle-cmds "apply-profile Deband-Medium" "apply-profile Deband-Medium restore"  #! 视频 > 画质 > 去色带 medium
Ctrl+Shift+x       script-message-to input_plus cycle-cmds "apply-profile Deband-High" "apply-profile Deband-High restore"    #! 视频 > 画质 > 去色带 high
Ctrl+Shift+j       script-message-to input_plus cycle-cmds "apply-profile Dither" "apply-profile Dither restore"          #! 视频 > 画质 > 色深抖动
Ctrl+Shift+z       script-message-to input_plus cycle-cmds "apply-profile Dither+" "apply-profile Dither+ restore"        #! 视频 > 画质 > 色深抖动+
Ctrl+h             script-message-to input_plus cycle-cmds "apply-profile HQ" "apply-profile HQ restore"                  #! 视频 > 画质 > 高质量缩放

## 场景模式
ALT+a              script-message-to input_plus cycle-cmds "apply-profile Mode-Anime" "apply-profile Mode-Anime restore"       #! 视频 > 场景 > 动画模式
ALT+m              script-message-to input_plus cycle-cmds "apply-profile Mode-LiveAction" "apply-profile Mode-LiveAction restore"  #! 视频 > 场景 > 影视模式
ALT+l              script-message-to input_plus cycle-cmds "apply-profile Mode-Live" "apply-profile Mode-Live restore"        #! 视频 > 场景 > 直播模式
ALT+s              script-message-to input_plus cycle-cmds "apply-profile Mode-SavePower" "apply-profile Mode-SavePower restore"  #! 视频 > 场景 > 省电模式

