########
# 着色器 #
########

## 通用
Ctrl+Shift+1       script-message-to input_plus cycle-cmds "apply-profile Shader-Nnedi3" "apply-profile Shader-Nnedi3 restore"     #! 着色器 > 通用 > NNEDI3
Ctrl+Shift+2       script-message-to input_plus cycle-cmds "apply-profile Shader-Nnedi3+" "apply-profile Shader-Nnedi3+ restore"    #! 着色器 > 通用 > NNEDI3+
Ctrl+Shift+3       script-message-to input_plus cycle-cmds "apply-profile Shader-Ravu-Zoom" "apply-profile Shader-Ravu-Zoom restore"  #! 着色器 > 通用 > RAVU Zoom
Ctrl+Shift+4       script-message-to input_plus cycle-cmds "apply-profile Shader-Fsrcnnx" "apply-profile Shader-Fsrcnnx restore"    #! 着色器 > 通用 > FSRCNNX
Ctrl+Shift+5       script-message-to input_plus cycle-cmds "apply-profile Shader-Fsrcnnx+" "apply-profile Shader-Fsrcnnx+ restore"   #! 着色器 > 通用 > FSRCNNX+
Ctrl+Shift+0       script-message-to input_plus cycle-cmds "apply-profile Shader-Ssim" "apply-profile Shader-Ssim restore"          #! 着色器 > 通用 > SSimSuperRes
Ctrl+3             no-osd change-list glsl-shaders toggle "~~/shaders/igv/FSRCNNX_x2_16-0-4-1.glsl"          #! 着色器 > 通用 > FSRCNNX
Ctrl+4             no-osd change-list glsl-shaders toggle "~~/shaders/nnedi3/nnedi3-nns128-win8x4.glsl"       #! 着色器 > 通用 > NNEDI3
Ctrl+5             no-osd change-list glsl-shaders toggle "~~/shaders/other/AMD_FSR_EASU_rgb_RT.glsl"         #! 着色器 > 通用 > FSR_EASU
Ctrl+9             no-osd change-list glsl-shaders toggle "~~/shaders/igv/adaptive-sharpen.glsl"              #! 着色器 > 通用 > 自适应锐化

## 动画
Ctrl+Shift+a       script-message-to input_plus cycle-cmds "apply-profile Shader-A4k-Mode-A" "apply-profile Shader-A4k-Mode-A restore"  #! 着色器 > 动画 > 组合：A4K Mode A
Ctrl+Shift+b       script-message-to input_plus cycle-cmds "apply-profile Shader-A4k-Mode-B" "apply-profile Shader-A4k-Mode-B restore"  #! 着色器 > 动画 > 组合：A4K Mode B
Ctrl+Shift+d       script-message-to input_plus cycle-cmds "apply-profile Shader-A4k-Dtdd" "apply-profile Shader-A4k-Dtdd restore"    #! 着色器 > 动画 > 组合：A4K DTDD
Ctrl+Shift+6       script-message-to input_plus cycle-cmds "apply-profile Shader-Animejanai" "apply-profile Shader-Animejanai restore"  #! 着色器 > 动画 > AnimeJaNai
Ctrl+Shift+7       script-message-to input_plus cycle-cmds "apply-profile Shader-Ani4k" "apply-profile Shader-Ani4k restore"           #! 着色器 > 动画 > Ani4K
Ctrl+Shift+8       script-message-to input_plus cycle-cmds "apply-profile Shader-Anisd" "apply-profile Shader-Anisd restore"           #! 着色器 > 动画 > AniSD
Ctrl+Shift+9       script-message-to input_plus cycle-cmds "apply-profile Shader-Anime4k" "apply-profile Shader-Anime4k restore"       #! 着色器 > 动画 > Anime4K Soft
Ctrl+1             no-osd change-list glsl-shaders toggle "~~/shaders/Ani4k/Ani4Kv2_ArtCNN_C4F32_i2.glsl"    #! 着色器 > 动画 > Ani4Kv2
Ctrl+2             no-osd change-list glsl-shaders toggle "~~/shaders/Ani4k/AniSD_ArtCNN_C4F32_i4.glsl"      #! 着色器 > 动画 > AniSD
Ctrl+6             no-osd change-list glsl-shaders toggle "~~/shaders/Anime4K/glsl/Restore/Anime4K_Restore_CNN_L.glsl"    #! 着色器 > 动画 > A4K 重建
Ctrl+7             no-osd change-list glsl-shaders toggle "~~/shaders/Anime4K/glsl/Upscale/Anime4K_Upscale_GAN_x2_M.glsl" #! 着色器 > 动画 > A4K 放大
Ctrl+8             no-osd change-list glsl-shaders toggle "~~/shaders/other/Anime4K_AIO_optQ.glsl"            #! 着色器 > 动画 > A4K 配置Q

## 清空
Ctrl+`             apply-profile Shader-Clear                           #! 着色器 > 清空

########
# 字幕 #
########

#                  script-binding uosc/load-subtitles                    #! 字幕 > 导入字幕轨
Ctrl+f             script-message-to sub_assrt sub-assrt                #! 字幕 > 下载字幕
ALT+f              script-message-to sub_fastwhisper sub-fastwhisper    #! 字幕 > AI生成字幕
#                  script-message-to sub_export export-selected-subtitles   #! 字幕 > 导出内封字幕
o                  cycle_values sub-ass-override no yes                 #! 字幕 > 切换ASS样式覆盖

########
# 截图 #
########

Ctrl+s             screenshot subtitles                                  #! 截图 > 带字幕
Ctrl+x             screenshot video                                      #! 截图 > 无字幕
Ctrl+c             screenshot window                                     #! 截图 > 窗口尺寸

########
# 工具 #
########

Ctrl+i             script-binding uosc/keybinds                          #! 工具 > 按键绑定列表
TAB                script-binding display-stats-toggle                   #! 工具 > 统计信息
`                  script-binding commands/open                          #! 工具 > 命令行
Ctrl+r             script-message-to save_global_props clean_data        #! 工具 > 清除属性缓存
#                  cycle border                                          #! 工具 > 窗口边框
t                  cycle ontop                                           #! 工具 > 窗口置顶
#                  script-binding uosc/show-in-directory                 #! 工具 > 打开文件路径
#                  script-binding uosc/open-config-directory             #! 工具 > 打开设置目录
Ctrl+u             script-message-to manager manager-update-all          #! 工具 > 检查更新

########
# 基础 #
########

Alt+`              apply-profile Base                                   #! 重置
Ctrl+q             quit                                                  #! 退出

### ====================== 仅快捷键（不显示在菜单） ======================

REWIND             seek -30 ; script-message-to uosc flash-elements timeline
FORWARD            seek  30 ; script-message-to uosc flash-elements timeline
PGUP               script-binding uosc/prev
PGDWN              script-binding uosc/next
POWER              quit
PLAY               set pause no
PAUSE              set pause yes
PLAYPAUSE          cycle pause
STOP               stop

### ====================== 鼠标绑定 ======================

MBTN_BACK          script-binding uosc/prev
MBTN_FORWARD       script-binding uosc/next
MBTN_LEFT          ignore
MBTN_LEFT_DBL      cycle fullscreen
MBTN_MID           script-binding uosc/menu
MBTN_RIGHT         script-binding uosc/menu
Ctrl+MBTN_RIGHT    context-menu
MBTN_RIGHT_DBL     ignore
WHEEL_DOWN         no-osd add volume -1 ; script-message-to uosc flash-elements volume
WHEEL_UP           no-osd add volume  1 ; script-message-to uosc flash-elements volume

### ====================== 播放控制键 ======================

ESC                set fullscreen no
ENTER              set fullscreen yes
kp_ENTER           set fullscreen yes
Alt+ENTER          cycle fullscreen
UP                 set pause yes ; seek -1 exact ; script-message-to uosc flash-elements timeline
DOWN               set pause yes ; seek  1 exact ; script-message-to uosc flash-elements timeline
LEFT               seek -5 exact ; script-message-to uosc flash-elements timeline
RIGHT              seek  5 exact ; script-message-to uosc flash-elements timeline
Ctrl+UP            script-binding uosc/prev
Ctrl+DOWN          script-binding uosc/next
Alt+MBTN_LEFT      script-binding positioning/drag-to-pan
BS                 no-osd set video-zoom 0 ; no-osd set panscan 0 ; no-osd set video-pan-x 0 ; no-osd set video-pan-y 0 ; no-osd set video-align-x 0 ; no-osd set video-align-y 0 ; show-text "重置画面"
Alt+WHEEL_DOWN     script-binding positioning/cursor-centric-zoom -0.1
Alt+WHEEL_UP       script-binding positioning/cursor-centric-zoom  0.1
g                  ignore
g-m                script-binding select/menu
MBTN_LEFT          cycle pause
j                  script-message show_danmaku_keyboard
Ctrl+d             script-message open_search_danmaku_menu
