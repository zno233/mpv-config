### 文档_ https://github.com/hooke007/MPV_lazy/blob/main/portable_config/input.conf
### 文档_ https://github.com/hooke007/MPV_lazy/blob/main/portable_config/input_uosc.conf
###
### 格式说明：
### 第一列   键位，# 在这为占位符
### 第二列   mpv原生命令或者lua脚本添加的命令
### 第三列   #! 映射到菜单， # 不映射到菜单

########
# 加载 #
########

HOME               script-binding recentmenu/open                        #! 加载 > 近期播放 #@recent
INS                script-binding uosc/open-file                         #! 加载 > 文件浏览器
Ctrl+Shift+v       loadfile ${clipboard/text}                            #! 加载 > 剪贴板URL

########
# 导航 #
########

## 轨道
#                  script-binding uosc/video                             #! 导航 > 轨道 > 视频轨
#                  script-binding uosc/audio                             #! 导航 > 轨道 > 音频轨
#                  script-binding uosc/subtitles                         #! 导航 > 轨道 > 字幕轨
#                  script-binding uosc/editions                          #! 导航 > 轨道 > 版本列表

## 列表
#                  script-binding uosc/playlist                          #! 导航 > 列表 > 播放列表
#                  script-binding uosc/chapters                          #! 导航 > 列表 > 章节列表
#                  playlist-shuffle                                      #! 导航 > 列表 > 播放列表乱序

## 跳转
Ctrl+Left          add chapter -1                                        #! 导航 > 跳转 > 上一章节
Ctrl+Right         add chapter  1                                        #! 导航 > 跳转 > 下一章节

########
# 播放 #
########

SPACE              cycle pause                                           #! 播放 > 暂停/播放
,                  frame-back-step                                       #! 播放 > 上一帧
.                  frame-step                                            #! 播放 > 下一帧
l                  ab-loop                                               #! 播放 > AB循环
[                  no-osd cycle-values speed 2 1.5 1.2 1                 #! 播放 > 速度 > 速度降低
]                  no-osd cycle-values speed 1 1.2 1.5 2                 #! 播放 > 速度 > 速度升高
{                  no-osd add speed -0.1                                 #! 播放 > 速度 > 速度 -0.1
}                  no-osd add speed  0.1                                 #! 播放 > 速度 > 速度 +0.1
-                  no-osd add volume -1                                  #! 播放 > 音量 > 音量降低
=                  no-osd add volume  1                                  #! 播放 > 音量 > 音量升高
c                  add audio-delay -0.1                                  #! 播放 > 同步 > 音频预载
v                  add audio-delay  0.1                                  #! 播放 > 同步 > 音频延迟
z                  add sub-delay -0.1                                    #! 播放 > 同步 > 字幕预载
x                  add sub-delay +0.1                                    #! 播放 > 同步 > 字幕延迟
Shift+BS           set audio-delay 0 ; set sub-delay 0                   #! 播放 > 同步 > 同步重置

## 均衡器
1                  add contrast -1                                       #! 播放 > 均衡器 > 对比度 -
2                  add contrast  1                                       #! 播放 > 均衡器 > 对比度 +
3                  add brightness -1                                     #! 播放 > 均衡器 > 亮度 -
4                  add brightness  1                                     #! 播放 > 均衡器 > 亮度 +
5                  add gamma -1                                          #! 播放 > 均衡器 > 伽马 -
6                  add gamma  1                                          #! 播放 > 均衡器 > 伽马 +
7                  add saturation -1                                     #! 播放 > 均衡器 > 饱和度 -
8                  add saturation  1                                     #! 播放 > 均衡器 > 饱和度 +
9                  add hue -1                                            #! 播放 > 均衡器 > 色相 -
0                  add hue  1                                            #! 播放 > 均衡器 > 色相 +
Ctrl+BS            set contrast 0 ; set brightness 0 ; set gamma 0 ; set saturation 0 ; set hue 0   #! 播放 > 均衡器 > 重置

########
# 视频 #
########

## 解码
#                  cycle-values hwdec "auto" "auto-copy" "no"            #! 视频 > 解码 > 切换模式
#                  cycle deinterlace                                     #! 视频 > 解码 > 去隔行
#                  cycle deband                                          #! 视频 > 解码 > 去色带
#                  cycle icc-profile-auto                                #! 视频 > 解码 > 自动校色
#                  cycle correct-pts                                     #! 视频 > 解码 > 时间码解析

## 画质
Ctrl+Shift+h       no-osd apply-profile HQ                              #! 视频 > 画质 > 高质量缩放
Ctrl+Shift+g       no-osd apply-profile Deband-Low                      #! 视频 > 画质 > 去色带 low
Ctrl+Shift+f       no-osd apply-profile Deband-Medium                   #! 视频 > 画质 > 去色带 medium
Ctrl+Shift+x       no-osd apply-profile Deband-High                     #! 视频 > 画质 > 去色带 high
Ctrl+Shift+j       no-osd apply-profile Dither                          #! 视频 > 画质 > 色深抖动
Ctrl+Shift+z       no-osd apply-profile Dither+                         #! 视频 > 画质 > 色深抖动+

########
# 滤镜 #
########

~                  vf clr ""                                             #! 滤镜 > 清空
!                  vf set vapoursynth="~~/vs/MEMC_MVT_LQ.vpy"            #! 滤镜 > MVTools > 快速
@                  vf set vapoursynth="~~/vs/MEMC_MVT_STD.vpy"           #! 滤镜 > MVTools > 标准
SHARP              vf set vapoursynth="~~/vs/MEMC_RIFE_DML.vpy"          #! 滤镜 > RIFE > DX12
$                  vf set vapoursynth="~~/vs/MEMC_RIFE_NV.vpy"           #! 滤镜 > RIFE > RTX
%                  vf set vapoursynth="~~/vs/MIX_UAI_DML.vpy"            #! 滤镜 > UAI > DX12
^                  vf set vapoursynth="~~/vs/MIX_UAI_NV_TRT.vpy"         #! 滤镜 > UAI > RTX

########
# 着色器 #
########

## 预设
Ctrl+`             no-osd apply-profile Shader-Clear                     #! 着色器 > 清空
Ctrl+Shift+a       no-osd apply-profile Shader-A4k-Mode-A                #! 着色器 > 预设 > A4K Mode A
Ctrl+Shift+b       no-osd apply-profile Shader-A4k-Mode-B                #! 着色器 > 预设 > A4K Mode B
Ctrl+Shift+d       no-osd apply-profile Shader-A4k-Dtdd                  #! 着色器 > 预设 > A4K DTDD
Ctrl+Shift+1       no-osd apply-profile Shader-Nnedi3                    #! 着色器 > 预设 > NNEDI3
Ctrl+Shift+2       no-osd apply-profile Shader-Nnedi3+                   #! 着色器 > 预设 > NNEDI3+
Ctrl+Shift+3       no-osd apply-profile Shader-Ravu-Zoom                 #! 着色器 > 预设 > RAVU Zoom
Ctrl+Shift+4       no-osd apply-profile Shader-Fsrcnnx                   #! 着色器 > 预设 > FSRCNNX
Ctrl+Shift+5       no-osd apply-profile Shader-Fsrcnnx+                  #! 着色器 > 预设 > FSRCNNX+
Ctrl+Shift+6       no-osd apply-profile Shader-Animejanai                #! 着色器 > 预设 > AnimeJaNai
Ctrl+Shift+7       no-osd apply-profile Shader-Ani4k                     #! 着色器 > 预设 > Ani4K
Ctrl+Shift+8       no-osd apply-profile Shader-Anisd                     #! 着色器 > 预设 > AniSD
Ctrl+Shift+9       no-osd apply-profile Shader-Anime4k                   #! 着色器 > 预设 > Anime4K Soft
Ctrl+Shift+0       no-osd apply-profile Shader-Ssim                      #! 着色器 > 预设 > SSimSuperRes

## 开关
Ctrl+1             change-list glsl-shaders toggle "~~/shaders/Ani4k/Ani4Kv2_ArtCNN_C4F32_i2.glsl"    #! 着色器 > 开关 > Ani4Kv2
Ctrl+2             change-list glsl-shaders toggle "~~/shaders/Ani4k/AniSD_ArtCNN_C4F32_i4.glsl"      #! 着色器 > 开关 > AniSD
Ctrl+3             change-list glsl-shaders toggle "~~/shaders/igv/FSRCNNX_x2_16-0-4-1.glsl"          #! 着色器 > 开关 > FSRCNNX
Ctrl+4             change-list glsl-shaders toggle "~~/shaders/nnedi3/nnedi3-nns128-win8x4.glsl"       #! 着色器 > 开关 > NNEDI3
Ctrl+5             change-list glsl-shaders toggle "~~/shaders/other/AMD_FSR_EASU_rgb_RT.glsl"         #! 着色器 > 开关 > FSR_EASU
Ctrl+6             change-list glsl-shaders toggle "~~/shaders/Anime4K/glsl/Restore/Anime4K_Restore_CNN_L.glsl"    #! 着色器 > 开关 > A4K 重建
Ctrl+7             change-list glsl-shaders toggle "~~/shaders/Anime4K/glsl/Upscale/Anime4K_Upscale_GAN_x2_M.glsl" #! 着色器 > 开关 > A4K 放大
Ctrl+8             change-list glsl-shaders toggle "~~/shaders/other/Anime4K_AIO_optQ.glsl"            #! 着色器 > 开关 > A4K 配置Q
Ctrl+9             change-list glsl-shaders toggle "~~/shaders/igv/adaptive-sharpen.glsl"              #! 着色器 > 开关 > 自适应锐化

########
# 字幕 #
########

#                  script-binding uosc/load-subtitles                    #! 字幕 > 导入字幕轨
Ctrl+f             script-message-to sub_assrt sub-assrt                #! 字幕 > 下载字幕
ALT+f              script-message-to sub_fastwhisper sub-fastwhisper    #! 字幕 > AI生成字幕
ALT+m              script-message-to sub_export export-selected-subtitles   #! 字幕 > 导出内封字幕
o                  cycle_values sub-ass-override no yes                 #! 字幕 > 切换ASS样式覆盖

########
# 截图 #
########

Ctrl+s             screenshot subtitles                                  #! 截图 > 带字幕
Ctrl+x             screenshot video                                      #! 截图 > 无字幕
Ctrl+c             screenshot window                                     #! 截图 > 窗口尺寸

########
# 工具 #
########

Ctrl+i             script-binding uosc/keybinds                          #! 工具 > 按键绑定列表
TAB                script-binding display-stats-toggle                   #! 工具 > 统计信息
`                  script-binding commands/open                          #! 工具 > 命令行
Ctrl+r             script-message-to save_global_props clean_data        #! 工具 > 清除属性缓存
#                  cycle border                                          #! 工具 > 窗口边框
t                  cycle ontop                                           #! 工具 > 窗口置顶
#                  script-binding uosc/show-in-directory                 #! 工具 > 打开文件路径
#                  script-binding uosc/open-config-directory             #! 工具 > 打开设置目录

########
# 退出 #
########

Ctrl+q             quit                                                  #! 退出

### ====================== 仅快捷键（不显示在菜单） ======================

REWIND             seek -30 ; script-message-to uosc flash-elements timeline
FORWARD            seek  30 ; script-message-to uosc flash-elements timeline
PGUP               script-binding uosc/prev
PGDWN              script-binding uosc/next
POWER              quit
PLAY               set pause no
PAUSE              set pause yes
PLAYPAUSE          cycle pause
STOP               stop

### ====================== 鼠标绑定 ======================

MBTN_BACK          script-binding uosc/prev
MBTN_FORWARD       script-binding uosc/next
MBTN_LEFT          ignore
MBTN_LEFT_DBL      cycle fullscreen
MBTN_MID           script-binding uosc/menu
MBTN_RIGHT         script-binding uosc/menu
Ctrl+MBTN_RIGHT    context-menu
MBTN_RIGHT_DBL     ignore
WHEEL_DOWN         no-osd add volume -1 ; script-message-to uosc flash-elements volume
WHEEL_UP           no-osd add volume  1 ; script-message-to uosc flash-elements volume

### ====================== 播放控制键 ======================

ESC                set fullscreen no
ENTER              set fullscreen yes
kp_ENTER           set fullscreen yes
Alt+ENTER          cycle fullscreen
UP                 set pause yes ; seek -1 exact ; script-message-to uosc flash-elements timeline
DOWN               set pause yes ; seek  1 exact ; script-message-to uosc flash-elements timeline
LEFT               seek -5 exact ; script-message-to uosc flash-elements timeline
RIGHT              seek  5 exact ; script-message-to uosc flash-elements timeline
Ctrl+UP            script-binding uosc/prev
Ctrl+DOWN          script-binding uosc/next
Alt+MBTN_LEFT      script-binding positioning/drag-to-pan
BS                 no-osd set video-zoom 0 ; no-osd set panscan 0 ; no-osd set video-pan-x 0 ; no-osd set video-pan-y 0 ; no-osd set video-align-x 0 ; no-osd set video-align-y 0 ; show-text "重置画面"
Alt+WHEEL_DOWN     script-binding positioning/cursor-centric-zoom -0.1
Alt+WHEEL_UP       script-binding positioning/cursor-centric-zoom  0.1
g                  ignore
g-m                script-binding select/menu
MBTN_LEFT          cycle pause
j                  script-message show_danmaku_keyboard
Ctrl+d             script-message open_search_danmaku_menu