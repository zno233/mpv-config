# ============================================================
# profile-chain.conf - 统一 Profile 触发系统配置
# ============================================================
#
# 本脚本统一管理 profile 的触发逻辑，支持以下触发方式：
#   1. property 观察：属性变化时触发链（如分辨率、HDR 亮度等）
#   2. 内容检测：根据路径/文件名/标题/音频语言检测内容类型，触发对应链
#   3. file-loaded：每次加载文件自动触发 Base 链
#   4. script-message：手动触发指定链（script-message profile-chain 链头）
#
# 配置分为两部分：
#   - 链定义（默认段）：定义链头和包含的 profile
#   - 内容检测（[detect] 段）：定义检测规则和触发的链头
#
# ============================================================


# ============================================================
# 链定义 (Chain Definitions)
# ============================================================
#
# 格式：
#   链头=profile1,profile2,profile3
#   链头.trigger=prop1,prop2
#
# 链头名称自定义，建议使用有意义的名称（如 Base、Mode-Anime）。
# 逗号分隔的 profile 按顺序应用，支持 profile-cond 条件评估：
#   - 有 profile-cond 的 profile：条件满足才应用
#   - 无 profile-cond 的 profile：直接应用
#
# trigger 属性：当这些属性变化时，自动重新触发该链。
# 常用 trigger 属性：
#   video-params/w              视频宽度
#   video-params/h              视频高度
#   video-params/average-bpp    平均位深
#   video-params/max-luma       HDR 最大亮度
#   video-params/primaries      色域（如 bt.709, bt.2020）
#   video-params/gamma          传输函数（如 bt.1886, pq）
#   current-tracks/video/id     视频轨 ID
#   current-tracks/audio/lang   音频语言代码
#   path                        文件路径
#   filename                    文件名
#   speed                       播放速度
#   pause                       暂停状态
#
# 示例：
#   Base=SD,Deband,HDR
#   Base.trigger=video-params/w,video-params/h,current-tracks/video/id
#
#   Mode-Anime=Shader-A4k-Mode-B
#   Mode-LiveAction=HQ,Shader-AdaptiveSharpen
#

# 基准链：每次加载文件时自动触发，重置手动预设状态
# SD: 720p 及以下启用超分辨率
# Deband: 色深不足时启用去色带
# HDR: 检测 HDR 内容后自动配置色调映射
Base=SD,Deband,HDR
Base.trigger=video-params/w,video-params/h,current-tracks/video/id

# 动画模式链：内容检测匹配到动画时触发
Mode-Anime=Shader-A4k-Mode-B

# 影视模式链：内容检测匹配到影视时触发（取消注释启用）
# Mode-LiveAction=HQ

# 省电模式链：手动触发（script-message profile-chain Mode-SavePower）
# Mode-SavePower=


# ============================================================
# 内容检测 (Content Detection)
# ============================================================
#
# 根据视频内容特征（路径、文件名、标题、音频语言）自动检测内容类型，
# 匹配成功后触发对应的链头，由链系统完成 profile 应用。
#
# 支持的检测模式：
#   anime    - 快捷模式，只检测 anime 相关规则
#   general  - 通用模式，按顺序检测所有 rule1, rule2... 规则
#   支持逗号分隔多个快捷模式，如: mode=anime,movie
#
# 匹配表达式语法（anime_match / ruleN_match）：
#
#   可用变量：
#     title - 元数据标题 (metadata/title)
#     name  - 文件名 (filename)
#     path  - 文件路径目录
#     audio - 当前音频轨道语言代码
#
#   可用运算符（优先级从高到低）：
#     !    - 逻辑取反 (NOT)
#     &    - 逻辑与 (AND)
#     ||   - 逻辑或 (OR)
#     ()   - 括号分组
#
#   示例：
#     path & audio              - 路径匹配 且 音频为指定语言
#     name || title             - 文件名或标题匹配
#     path & !audio             - 路径匹配 但 音频不是指定语言
#     (path & audio) || title   - (路径且音频) 或 标题匹配
#     !(name & title)           - 文件名和标题不同时匹配
#
# 关键字语法（anime_keywords / ruleN_keywords）：
#
#   默认关键字为纯字面量匹配（自动转义特殊字符），
#   按分隔符 . _ - 空格 [] 分词后逐段匹配。
#
#   如需使用 Lua pattern 匹配，添加 "re:" 前缀
#   （注意：不支持 PCRE 语法，| () 等是字面量）
#
#   示例：
#     anime          - 字面量匹配 "anime"
#     re:%d+p        - Lua pattern 匹配分辨率如 "1080p", "720p"
#     re:Subs$       - 匹配以 "Subs" 结尾的路径段
#
#   提示：keywords 按匹配频率排序，高频关键字放前面可提前返回提升性能

[detect]

# 检测模式
# anime    - 快捷模式，只检测 anime 相关规则
# general  - 通用模式，按顺序检测所有 rule1, rule2... 规则
# 支持逗号分隔多个快捷模式，如: mode=anime,movie
mode=anime

# 未匹配任何规则时应用的默认链头（留空则不应用）
default=

# OSD 提示设置
# show_osd: 是否显示 OSD 提示 (yes/no)
# osd_duration: OSD 显示时间 (毫秒)
# show_no_match: 未匹配时是否显示 OSD (yes/no)
show_osd=yes
osd_duration=1500
show_no_match=no

# general 模式下最大规则数 (默认10)
max_rules=10

# 路径匹配时保留的末尾目录层级
# 0 = 检查所有目录层级（默认）
# 1 = 只检查文件所在目录
# 2 = 检查文件所在目录及其上一级
path_depth=0


# ============================================================
# 快捷模式配置 (Quick Mode Rules)
# ============================================================
#
# 格式：{mode}_keywords / {mode}_languages / {mode}_match / {mode}_profile
#
# profile = 匹配成功时触发的链头名称（需在上方链定义中存在）
# 如果链头未定义链，则直接应用该 profile 作为回退

# --- Anime 模式 ---
# 检测动画内容，触发 Mode-Anime 链
anime_keywords=VCB-Studio,LoliHouse,喵萌奶茶屋,Sakurato,MiaoMeng,Kira,HorribleSubs,Commie,FFF,Horo,Subs,anime,ani
anime_languages=jpn,ja
anime_match=(path || name) & audio
anime_profile=Mode-Anime

# --- Movie 模式 (示例，取消注释启用) ---
# 检测影视内容，触发 Mode-LiveAction 链
# movie_keywords=bluray,bdrip,remux,re:%d+p
# movie_languages=eng,chi,zho
# movie_match=(name || title) & !audio
# movie_profile=Mode-LiveAction


# ============================================================
# 通用规则配置 (General Mode Rules)
# ============================================================
#
# 仅在 mode=general 时生效
# 按 rule1 → ruleN 顺序匹配，首个命中即停止
#
# 格式：rule{N}_name / rule{N}_keywords / rule{N}_languages / rule{N}_match / rule{N}_profile
# N 为 1 到 max_rules 的数字

# rule1_name=日剧
# rule1_keywords=jdrama,japanese_drama
# rule1_languages=jpn,ja
# rule1_match=path & audio
# rule1_profile=Mode-JDrama

# rule2_name=纪录片
# rule2_keywords=documentary,纪录片,re:BBC,re:NHK
# rule2_languages=chi,zho,eng
# rule2_match=(path || title) & audio
# rule2_profile=Mode-Doc

# rule3_name=综艺
# rule3_keywords=variety_show,综艺节目
# rule3_languages=chi,zho
# rule3_match=path & audio
# rule3_profile=Mode-Variety

# rule4_name=新闻
# rule4_keywords=news,新闻,新闻报道
# rule4_languages=chi,zho,eng
# rule4_match=path & audio
# rule4_profile=Mode-News

# rule5_name=非日语番剧
# rule5_keywords=anime,animation
# rule5_languages=jpn,ja
# rule5_match=path & !audio
# rule5_profile=Mode-NonJPAnime
