# ============================================================
# profile-chain.conf - 统一 Profile 触发系统配置
# ============================================================
#
# 本脚本统一管理 profile 的触发逻辑，支持以下触发方式：
#   1. file：每次加载文件时触发链
#   2. property：属性变化时触发链（如分辨率、HDR 亮度等）
#   3. trigger：根据规则匹配内容，触发对应链
#   4. script-message：手动触发指定链（script-message profile-chain 链头）
#
# 配置分为两部分：
#   - 链定义（默认段）：定义链头、包含的 profile 和触发方式
#   - 规则定义（[trigger] 段）：定义匹配规则和触发的链头
#
# ============================================================


# ============================================================
# 链定义 (Chain Definitions)
# ============================================================
#
# 格式：
#   链头=profile1,profile2,profile3
#   链头.on=触发方式1
#   链头.on=触发方式2
#
# 链头名称自定义，建议使用有意义的名称（如 Base、Mode-Anime）。
# 逗号分隔的 profile 按顺序应用，支持 profile-cond 条件评估：
#   - 有 profile-cond 的 profile：条件满足才应用；条件不满足则不应用，
#     并且【中断】整条链的后续执行（保护机制，见下方说明）
#   - 无 profile-cond 的 profile：无条件应用，链继续
#
# --- profile-cond 保护机制与强制执行 ---
# 链是按顺序应用的一串 profile。如果链中某个带 profile-cond 的 profile
# 条件不满足，通常意味着后面的 profile 也不再适用于当前内容，因此脚本会
# 在此处中断整条链的执行（后面的 profile 一律不再应用）。
#
# 如果某个 profile 无论如何都必须执行（无视自身的 profile-cond，也不参与
# 中断判断），可以在它的名字前加一个 "*" 前缀强制执行。例如：
#
#   Base=*SD,Deband,HDR
#
# 这里 SD 无论其 profile-cond 结果如何都会被应用，且不会因为条件失败而
# 中断 Base 链后面 Deband / HDR 的执行。若 SD 本身没有配置 profile-cond，
# 则 "*" 前缀不会改变行为（等价于无条件 profile）。
#
# 触发方式（.on=）：
#   file                           - 每次加载文件时触发
#   property:prop1,prop2           - 属性变化时触发
#   trigger                        - 规则匹配时触发（需在 [trigger] 段定义规则）
#   trigger:N                      - 仅 ruleN 匹配时触发
#   trigger:N,M,...                - 仅 ruleN, ruleM,... 匹配时触发（可指定多个）
#   （留空）                       - 不自动触发，仅 script-message 手动触发
#
# 常用 property 触发属性：
#   video-params/w              视频宽度
#   video-params/h              视频高度
#   video-params/average-bpp    平均位深
#   video-params/max-luma       HDR 最大亮度
#   video-params/primaries      色域（如 bt.709, bt.2020）
#   video-params/gamma          传输函数（如 bt.1886, pq）
#   current-tracks/video/id     视频轨 ID
#   current-tracks/audio/lang   音频语言代码
#   path                        文件路径
#   filename                    文件名
#   speed                       播放速度
#   pause                       暂停状态
#
# 执行阶段（.phase=）：
#   early                        - start-file 时立即执行，在属性变化和 mpv auto_profiles 之前
#   normal（默认）               - playback-restart 时执行，在 mpv auto_profiles 之后
#
# 每个 phase 内部有独立的 .order 排序。early 阶段整体先于 normal 阶段执行。
# 例如 Base.phase=early + Base.order=1 表示"在 start-file 时第 1 个执行"。


# 基础回归链：视频轨改变时触发，清除上一个文件遗留的状态
# Base: 清空着色器和重置默认参数
Base=Base
Base.on=property:current-tracks/video/id
Base.order=1
Base.phase=early

# 动画模式链：规则匹配到动画时触发（仅 rule1 匹配时触发）
Mode-Anime=Shader-A4k-Mode-B
Mode-Anime.on=trigger:1
Mode-Anime.order=2

# 直播链：自动触发，低延迟设置
Mode-Live=Mode-Live
Mode-Live.on=trigger:2
Mode-Live.order=2
Mode-Live.phase=early

# 网络流媒体链：自动触发，优化缓存和缓冲
Network-Stream=Network-Stream
Network-Stream.on=trigger:3
Network-Stream.order=3
Network-Stream.phase=early

# 影视模式链：规则匹配到影视时触发（取消注释启用）
# Mode-LiveAction=HQ
# Mode-LiveAction.on=trigger

# 省电模式链：仅手动触发（script-message profile-chain Mode-SavePower）
# .on= 留空 = 不自动触发
# Mode-SavePower=
# Mode-SavePower.on=


# ============================================================
# 规则定义 (Trigger Rules)
# ============================================================
#
# 按 rule1 → ruleN 顺序匹配，首个命中即停止。
# 支持两种规则类型：
#
# 1. 高级规则：使用 keywords + languages + match 组合匹配
#    - keywords: 关键词列表，匹配文件名/路径/标题
#    - languages: 语言列表，匹配音频语言
#    - match: 逻辑表达式，组合 keywords/languages 的匹配结果
#
# 2. 简单规则：直接使用 Lua 表达式匹配
#    - match: Lua 表达式，可访问任意 mpv 属性
#    - 不需要 keywords/languages
#
# ============================================================


# ============================================================
# 匹配表达式语法 (Match Expression Syntax)
# ============================================================
#
# 变量（高级规则中可用，返回 true/false 布尔值）：
#   title - 元数据标题匹配结果 (由 keywords 定义)
#   name  - 文件名匹配结果 (由 keywords 定义)
#   path  - 文件路径匹配结果 (由 keywords 定义)
#   audio - 当前音频轨道语言匹配结果 (由 languages 定义)
#
# 注意：在高级规则中，path/name/title/audio 都是布尔值，
# 不能使用 path:find('...') 这种 Lua 字符串操作。
# 如需字符串操作，请使用 "简单规则" (rule_type=lua)。
#
# 运算符（优先级从高到低）：
#   !    - 逻辑取反 (NOT)
#   &    - 逻辑与 (AND)
#   ||   - 逻辑或 (OR)
#   ()   - 括号分组
#
# 示例：
#   path & audio              - 路径匹配 且 音频为指定语言
#   name || title             - 文件名或标题匹配
#   path & !audio             - 路径匹配 但 音频不是指定语言
#   (path & audio) || title   - (路径且音频) 或 标题匹配
#   !(name & title)           - 文件名和标题不同时匹配


# ============================================================
# 关键词语法 (Keywords Syntax)
# ============================================================
#
# 默认关键字为纯字面量匹配（自动转义特殊字符），
# 按分隔符 . _ - 空格 [] 分词后逐段匹配。
#
# 如需使用 Lua pattern 匹配，添加 "re:" 前缀
# （注意：不支持 PCRE 语法，| () 等是字面量）
#
# 示例：
#   anime          - 字面量匹配 "anime"
#   re:%d+p        - Lua pattern 匹配分辨率如 "1080p", "720p"
#   re:Subs$       - 匹配以 "Subs" 结尾的路径段
#
# 提示：keywords 按匹配频率排序，高频关键字放前面可提前返回提升性能


# ============================================================
# 简单规则示例 (Simple Rule Examples)
# ============================================================
#
# 直接使用 Lua 表达式，无需 keywords/languages。
# 可用函数：
#   get(prop)        - 获取 mpv 属性值（数字或字符串）
#   path             - 当前文件路径
#   filename         - 当前文件名
#   vid/aid/sid      - 视频/音频/字幕轨 ID
#   p.xxx            - 等同于 get("xxx")
#
# 可用属性（直接作为变量）：
#   width, height    - 视频分辨率
#   container-fps    - 容器帧率
#   estimated-vf-fps - 估算帧率
#   display-fps      - 显示器刷新率
#   pause            - 暂停状态
#   speed            - 播放速度
#
# 提示：这些表达式只在脚本加载时编译一次，但每次求值前属性缓存都会被清空，
# 因此 path/filename 以及其它属性变量总是反映当前正在播放的文件的最新状态。


# ============================================================
# 规则配置 (Rule Configuration)
# ============================================================
#
# 格式：rule{N}_name / rule{N}_keywords / rule{N}_languages / rule{N}_match / rule{N}_profile
# N 为 1 到 max_rules 的数字

# --- 高级规则：动画检测 ---
# 使用 keywords + languages + match 组合匹配
rule1_name=Anime
rule1_keywords=VCB-Studio,LoliHouse,喵萌奶茶屋,Sakurato,MiaoMeng,Kira,HorribleSubs,Commie,FFF,Horo,Subs,anime,ani
rule1_languages=jpn,ja
rule1_match=(path || name) & audio
rule1_profile=Mode-Anime

# --- 简单规则：直播检测 ---
rule2_name=LiveStream
rule2_type=lua
rule2_match=path:find('twitch.tv') ~= nil or path:find('youtube.com/live') ~= nil or path:find('bilibili.com/live') ~= nil or path:find('douyu.com') ~= nil or path:find('huya.com') ~= nil or path:find('yy.com') ~= nil
rule2_profile=Mode-Live

# --- 简单规则：网络流媒体检测 ---
rule3_name=NetworkStream
rule3_type=lua
rule3_match=path:find('://') ~= nil or path:find('^magnet:') ~= nil
rule3_profile=Network-Stream

# --- 高级规则：纪录片检测 ---
# 注意：高级规则中 path/title/audio 是布尔变量，不能用 path:find()
# rule4_name=Documentary
# rule4_keywords=documentary,纪录片,re:BBC,re:NHK
# rule4_languages=chi,zho,eng
# rule4_match=(path || title) & audio
# rule4_profile=Mode-Doc

# --- 高级规则：日剧检测 ---
# rule5_name=JDrama
# rule5_keywords=jdrama,japanese_drama
# rule5_languages=jpn,ja
# rule5_match=path & audio
# rule5_profile=Mode-JDrama

# --- 简单规则：网络流媒体检测 ---
# rule6_name=NetworkStream
# rule6_match=path:find('://') ~= nil or path:find('^magnet:') ~= nil
# rule6_profile=Mode-Network

# --- 简单规则：本地文件检测 ---
# rule7_name=LocalFile
# rule7_match=path:find('://') == nil and path:find('^magnet:') == nil
# rule7_profile=Mode-Local


# ============================================================
# 设置 (Settings)
# ============================================================

# 无视频轨（例如仅音频文件）时，是否默认不触发任何链（file/property/trigger/default）。
# yes（默认）：无视频轨时跳过所有自动触发，仅 script-message 手动触发仍然有效
# no：不做此限制，无视频轨时也照常触发链
require_video=yes

# 同一条链若同时挂了多种触发方式（如 file + property），加载文件本身就会让这
# 几种触发方式几乎同时各自触发一次（因为 video-params/current-tracks 等属性也
# 会随着文件加载从旧值变为新值）。此设置用于把短时间内对同一条链的重复应用
# 合并为一次，单位为秒。设为 0 关闭此合并（不建议，除非你确实需要每次触发都
# 重新应用一遍）。script-message 手动触发不受此限制。
chain_reapply_cooldown=0.3

# OSD 提示设置
# show_osd: 是否显示 OSD 提示 (yes/no)
# osd_duration: OSD 显示时间 (毫秒)
# show_no_match: 未匹配时是否显示 OSD (yes/no)
show_osd=yes
osd_duration=1500
show_no_match=no

# 最大规则数 (默认10)
max_rules=10

# 路径匹配时保留的末尾目录层级
# 0 = 检查所有目录层级（默认）
# 1 = 只检查文件所在目录
# 2 = 检查文件所在目录及其上一级
path_depth=2
