# profile-chain.conf
# Unified profile trigger system configuration
#
# Sections:
#   [chain]  - Chain definitions and property triggers (default section)
#   [detect] - Content detection settings
#
# Chain format:
#   chain_head=profile1,profile2
#   chain_head.trigger=prop1,prop2
#
# Content detection triggers a chain head when content type is detected.
# The chain head then applies its profiles with profile-cond evaluation.

# ============================================================
# Chain Definitions
# ============================================================

Base=SD,Deband,HDR
Base.trigger=video-params/w,video-params/h,current-tracks/video/id

Mode-Anime=Shader-A4k-Mode-B
# Mode-LiveAction=HQ
# Mode-SavePower=

# ============================================================
# Content Detection
# ============================================================

[detect]

# detect mode: anime, movie, general, or comma-separated multiple modes
mode=anime

# Default chain head when no rule matches (empty = skip)
default=

# OSD settings
show_osd=yes
osd_duration=1500
show_no_match=no

# general mode max rules
max_rules=10

# Path matching depth: 0=all levels, 1=filename dir only, 2=+parent
path_depth=0

# --- Anime Rules ---
# profile = chain head to trigger when matched
anime_keywords=VCB-Studio,LoliHouse,喵萌奶茶屋,Sakurato,MiaoMeng,Kira,HorribleSubs,Commie,FFF,Horo,Subs,anime,ani
anime_languages=jpn,ja
anime_match=(path || name) & audio
anime_profile=Mode-Anime

# --- Movie Rules (example, uncomment to enable) ---
# movie_keywords=bluray,bdrip,remux,re:%d+p
# movie_languages=eng,chi,zho
# movie_match=(name || title) & !audio
# movie_profile=Mode-LiveAction

