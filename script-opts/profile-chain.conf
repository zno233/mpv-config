# ============================================================
# profile-chain.conf - 脚本自动触发系统配置
# ============================================================
#
# 本脚本统一管理 profile-chain 中"脚本自动预设"的触发逻辑。
# 支持以下触发方式：
#   1. file：每次加载文件时触发链条
#   2. property：属性变化时触发链条（如视频轨 ID 变化）
#   3. trigger：根据规则匹配内容，触发对应链条
#   4. script-message：手动触发指定链条（script-message profile-chain 链条名）
#
# 配置分为两部分：
#   - 链条定义（默认段）：定义链条名、包含的 profile 和触发方式
#   - 规则定义（[trigger] 段）：定义匹配规则和触发的链条
#
# ============================================================


# ============================================================
# 链条定义 (Chain Definitions)
# ============================================================
#
# 格式：
#   链条名=profile1,profile2,profile3
#   链条名.on=触发方式
#   链条名.order=执行顺序（数字越小越先执行）
#   链条名.phase=执行阶段（early / normal）
#
# 触发方式（.on=）：
#   file                           - 每次加载文件时触发
#   property:prop1,prop2           - 属性变化时触发
#   trigger:N                      - 仅 ruleN 匹配时触发
#   trigger:N,M,...                - ruleN, ruleM,... 任一匹配时触发
#   （留空）                       - 不自动触发，仅 script-message 手动触发
#
# 执行阶段（.phase=）：
#   early                          - start-file 时立即执行，在 auto_profiles 之前
#   normal（默认）                 - playback-restart 时执行，在 auto_profiles 之后
#
# ============================================================

# 动画模式链：rule1（动画关键词 + 日语）匹配时触发
Mode-Anime=Shader-A4k-Mode-B
Mode-Anime.on=trigger:1
Mode-Anime.order=1

# 直播链：rule2（直播平台路径）匹配时触发
Mode-Live=Mode-Live
Mode-Live.on=trigger:2
Mode-Live.order=2
Mode-Live.phase=early

# 网络流媒体链：rule3（网络协议路径）匹配时触发
Network-Stream=Network-Stream
Network-Stream.on=trigger:3
Network-Stream.order=3
Network-Stream.phase=early


# ============================================================
# 规则定义 (Trigger Rules)
# ============================================================
#
# 按 rule1 → ruleN 顺序匹配，首个命中即停止。
# 支持两种规则类型：
#
# 1. 高级规则（默认）：使用 keywords + languages + match 组合匹配
#    - keywords: 关键词列表，匹配文件名/路径/标题
#    - languages: 语言列表，匹配音频语言
#    - match: DSL 逻辑表达式，组合 keywords/languages 的匹配结果
#
# 2. 简单规则（rule_type=lua）：直接使用 Lua 表达式匹配
#    - match: Lua 表达式，可访问任意 mpv 属性
#    - 不需要 keywords/languages
#
# DSL 表达式变量（高级规则）：
#   path / name / title / audio  — 布尔值，由 keywords/languages 定义
#
# DSL 运算符（优先级从高到低）：
#   !    逻辑取反    &    逻辑与    | / ||    逻辑或    ()    括号分组
#
# Lua 表达式可用：
#   get(prop)  path  filename  vid/aid/sid  p.xxx  width  height  ...
#
# ============================================================

# --- rule1: 动画检测（高级规则）---
rule1_name=Anime
rule1_keywords=VCB-Studio,LoliHouse,喵萌奶茶屋,Sakurato,MiaoMeng,Kira,HorribleSubs,Commie,FFF,Horo,Subs,anime,ani
rule1_languages=jpn,ja
rule1_match=(path || name) & audio
rule1_profile=Mode-Anime

# --- rule2: 直播检测（简单规则）---
rule2_name=LiveStream
rule2_type=lua
rule2_match=path:find('twitch.tv') ~= nil or path:find('youtube.com/live') ~= nil or path:find('bilibili.com/live') ~= nil or path:find('douyu.com') ~= nil or path:find('huya.com') ~= nil or path:find('yy.com') ~= nil
rule2_profile=Mode-Live

# --- rule3: 网络流检测（简单规则）---
rule3_name=NetworkStream
rule3_type=lua
rule3_match=path:find('://') ~= nil or path:find('^magnet:') ~= nil
rule3_profile=Network-Stream


# ============================================================
# 设置 (Settings)
# ============================================================

# 无视频轨时是否跳过所有自动触发（script-message 手动触发不受影响）
require_video=yes

# 同一链条重复应用的冷却时间（秒），防止 file + property 同时触发导致重复
chain_reapply_cooldown=0.3

# 规则设置
max_rules=10

# 路径匹配时保留的末尾目录层级（0=全部, 1=文件所在目录, 2=含上一级）
path_depth=2

# OSD 提示设置
show_osd=yes
osd_duration=1500
show_no_match=no


# ============================================================
# Property 快照还原 (Property Snapshot Restore)
# ============================================================
# 启动时捕获属性值，每次加载新视频时还原
# 来源：profiles.conf 中的 profile 属性 + snapshot_include_props 额外指定的属性
# 防止上一个视频的设置（着色器、滤镜等）污染下一个视频

# yes=启用 no=禁用
snapshot_enabled=yes

# 排除不参与快照的 profile（逗号分隔）
# 适用于平台配置组、播放控制组、窗口状态组等不应还原的 profile
snapshot_exclude=Shader-Clear,Win,Linux,Macos-Arm,Macos-Intel,Speed-Limit1,Speed-Limit2,Vsync-Display,Save-Props-Auto,Pause,Maximized,End,Minimized,Media-Title

# 排除不参与快照的属性（逗号分隔）
snapshot_exclude_props=

# 手动添加需要快照的属性（逗号分隔）
# 适用于不在 profiles.conf 中定义但需要还原的属性
snapshot_include_props=vf,af
