# content-detect.conf

# 检测模式
# anime    - 快捷模式（O(1)，只检测对应类型）
# general  - 通用模式（O(n)，检测所有规则）
mode=anime

# 未匹配时应用的默认 profile（留空则不应用）
default_profile=

# 显示 OSD 提示
show_osd=yes
osd_duration=2000
show_no_match=no
max_rules=10

# 路径向上查找深度
# 0 = 检查所有目录层级（默认）
# 1 = 只检查文件所在目录
# 2 = 检查文件所在目录及其上一级
path_depth=2

# 匹配模式语法
# 可用运算符：
#   &  - 逻辑与（AND）
#   || - 逻辑或（OR）
# 可用操作数：
#   title - 标题（metadata/title）
#   name  - 文件名
#   path  - 路径目录
#   audio - 音频语言
# 可用括号：
#   () - 分组（最高优先级）
#
# 操作数详解：
#   title = 标题匹配（字幕组/压制组识别）
#   name  = 文件名匹配（含字幕组、编码信息）
#   path  = 路径目录匹配（按目录层级）
#   audio = 音频语言匹配
#
# 文件名分隔符：
#   . _ - 空格 []（支持字幕组标记）
#
# 示例：
#   title          - 仅匹配标题
#   name           - 仅匹配文件名
#   path           - 仅匹配路径
#   audio          - 仅匹配语言
#   title&audio    - 标题 AND 语言
#   name||title    - 文件名 OR 标题
#   (path&audio)||title - (路径 AND 语言) OR 标题

# 快捷模式配置
# 格式：{mode}_keywords/languages/match/profile
# profile 要与 profiles.conf 里定义的项匹配
# keywords 按匹配频率排序，常用的放前面可以提前返回

anime_keywords=anime,lolihouse,喵萌奶茶屋,ani,sakurato,miaomeng,kira,horriblesubs,commie,fff,horo,subs
anime_languages=jpn,ja
anime_match=path&audio
anime_profile=Mode-Anime

# 扩展规则（仅 mode=general 时生效）
# 格式：rule{N}_name/keywords/languages/match/profile
# 需要在 profiles.conf 中定义对应的 profile

rule1_name=日剧
rule1_keywords=jdrama,japanese_drama
rule1_languages=jpn,ja
rule1_match=path&audio
rule1_profile=Mode-JDrama

rule2_name=纪录片
rule2_keywords=documentary,纪录片
rule2_languages=chi,zho,eng
rule2_match=path&audio
rule2_profile=Mode-Doc

rule3_name=综艺
rule3_keywords=variety_show,综艺节目
rule3_languages=chi,zho
rule3_match=path&audio
rule3_profile=Mode-Variety

rule4_name=新闻
rule4_keywords=news,新闻,新闻报道
rule4_languages=chi,zho,eng
rule4_match=path&audio
rule4_profile=Mode-News
