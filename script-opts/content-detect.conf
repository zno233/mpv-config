# ============================================================
# content-detect 脚本配置文件
# ============================================================

# 【重要提示】
# 建议在 mpv.conf 的 profile 定义中加入 `profile-restore=copy`，
# 以防止连续播放不同视频时 profile 设置残留导致配置污染。
# 例如：
# [Mode-Anime]
# profile-restore=copy
# hwdec=auto
# ...

# ================= 基础设置 =================

# 检测模式
# anime    - 快捷模式，只检测 anime 相关规则
# general  - 通用模式，按顺序检测所有 rule1, rule2... 规则
# 支持逗号分隔多个快捷模式，如: mode=anime,movie
mode=anime

# 未匹配任何规则时应用的默认 profile（留空则不应用）
default_profile=

# OSD 提示设置
show_osd=yes
osd_duration=1500
show_no_match=no

# general 模式下最大规则数 (默认10)
max_rules=10

# 路径匹配时保留的末尾目录层级
# 0 = 检查所有目录层级（默认）
# 1 = 只检查文件所在目录
# 2 = 检查文件所在目录及其上一级
path_depth=0

# ================= 匹配表达式语法 =================

# 可用变量：
#   title - 元数据标题 (metadata/title)
#   name  - 文件名 (filename)
#   path  - 文件路径目录
#   audio - 当前音频轨道语言代码
#
# 可用运算符（优先级从高到低）：
#   !    - 逻辑取反 (NOT)
#   &    - 逻辑与 (AND)
#   ||   - 逻辑或 (OR)
#   ()   - 括号分组
#
# 示例：
#   path & audio              - 路径匹配 且 音频为指定语言
#   name || title             - 文件名或标题匹配
#   path & !audio             - 路径匹配 但 音频不是指定语言
#   (path & audio) || title   - (路径且音频) 或 标题匹配
#   !(name & title)           - 文件名和标题不同时匹配

# ================= 关键字语法 =================

# 默认关键字为纯字面量匹配（自动转义特殊字符），按分隔符 . _ - 空格 [] 分词
# 如需使用 Lua pattern 匹配，添加 "re:" 前缀（注意：不支持 PCRE 语法，| () 等是字面量）
# 示例：
#   anime          - 字面量匹配 "anime"
#   re:%d+p        - Lua pattern 匹配分辨率如 "1080p", "720p"
#   re:Subs$       - 匹配以 "Subs" 结尾的路径段
#
# 提示：keywords 按匹配频率排序，高频关键字放前面可提前返回提升性能

# ================= 快捷模式配置 =================
# 格式：{mode}_keywords / {mode}_languages / {mode}_match / {mode}_profile
# profile 名称需与 mpv.conf 或 profiles.conf 中定义的 profile 一致

# --- Anime 模式配置 ---
anime_keywords=VCB-Studio,LoliHouse,喵萌奶茶屋,Sakurato,MiaoMeng,Kira,HorribleSubs,Commie,FFF,Horo,Subs,anime,ani
anime_languages=jpn,ja
anime_match=(path || name) & audio
anime_profile=Mode-Anime

# --- Movie 模式配置 (示例，取消注释启用) ---
# movie_keywords=bluray,bdrip,remux,re:%d+p
# movie_languages=eng,chi,zho
# movie_match=(name || title) & !audio
# movie_profile=Mode-Movie

# ================= 通用规则配置 =================
# 仅在 mode=general 时生效，按 rule1 → ruleN 顺序匹配，首个命中即停止
# 格式：rule{N}_name / rule{N}_keywords / rule{N}_languages / rule{N}_match / rule{N}_profile

# rule1_name=日剧
# rule1_keywords=jdrama,japanese_drama
# rule1_languages=jpn,ja
# rule1_match=path & audio
# rule1_profile=Mode-JDrama

# rule2_name=纪录片
# rule2_keywords=documentary,纪录片,re:BBC,re:NHK
# rule2_languages=chi,zho,eng
# rule2_match=(path || title) & audio
# rule2_profile=Mode-Doc

# rule3_name=综艺
# rule3_keywords=variety_show,综艺节目
# rule3_languages=chi,zho
# rule3_match=path & audio
# rule3_profile=Mode-Variety

