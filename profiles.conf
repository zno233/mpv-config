### 文档_ https://github.com/hooke007/MPV_lazy/blob/main/portable_config/profiles.conf

##############
# 平台配置组 #
##############
# 根据操作系统自动切换视频输出（vo）、图形 API、音频输出（ao）和 IPC 通信方式
# Windows: d3d11 原生 API 性能最优，wasapi 音频，named pipe 通信
# Linux: vulkan + Wayland，pipewire 音频，/tmp socket 通信
# macOS: vulkan（ARM）或 auto（Intel），coreaudio 音频

[win]
profile-cond=platform == "win32"
profile-restore=copy
vo=gpu-next
gpu-api=auto
ao=wasapi
input-ipc-server="mpvsocket"
snap-window=yes

[linux]
profile-cond=platform == "linux"
profile-restore=copy
vo=gpu-next
gpu-context=waylandvk
gpu-api=vulkan
vulkan-async-transfer=yes
vulkan-async-compute=yes
hwdec=vulkan,nvdec,no
hwdec-codecs=h264,hevc,vp8,vp9,av1
ao=pipewire
input-ipc-server="/tmp/mpvsocket"

[macos-arm]
profile-cond=platform == "darwin" and os.exec("uname -m") == "arm64"
profile-restore=copy
vo=gpu-next
gpu-api=vulkan
ao=coreaudio
input-ipc-server="/tmp/mpvsocket"

[macos-intel]
profile-cond=platform == "darwin" and os.exec("uname -m") == "x86_64"
profile-restore=copy
vo=gpu-next
gpu-api=auto
ao=coreaudio
input-ipc-server="/tmp/mpvsocket"

##############
# 播放控制组 #
##############
# 根据播放状态动态调整参数，无需手动干预

[speed_limit1]
profile-desc=防止快捷键误触导致播放速度低于 0.1
profile-cond=p.speed<0.1
speed=0.1

[speed_limit2]
profile-desc=防止快捷键误触导致播放速度超过 8 倍
profile-cond=p.speed>8
speed=8

## https://github.com/mpv-player/mpv/issues/11122
[vsync_auto]
profile-desc=高帧率或变速时切换为音频同步，避免 display-resample 卡顿
profile-cond=p.container_fps>32 or (p.display_fps/p.container_fps)>3.2 or p.speed~=1
profile-restore=copy
interpolation=no
video-sync=audio

[save_props_auto]
profile-desc=短片、图片、纯音频不记录进度，避免污染历史记录
profile-cond=p.percent_pos>=90 or p.duration<=300 or not vid or p["current-tracks/video/albumart"] or p["current-tracks/video/image"]
profile-restore=copy
save-position-on-quit=no

##############
# 画质条件组 #
##############
# 根据视频内容特征自动优化画质，无需手动切换

[SD]
profile-desc=720p 及以下启用超分辨率（需配合 glsl-shaders）
profile-cond=height <= 720 or width <= 720
profile-restore=copy
#profile=FSRCNNX+

[Deband]
profile-desc=色深不足时启用去色带，8k 视频自动禁用
profile-cond=get("video-params/average-bpp") < 24 and not (get("video-params/w") > 7000 or get("video-params/h") > 3000)
profile-restore=copy
deband=yes

[HDR]
profile-desc=检测 HDR 内容后自动配置色调映射和色彩空间直通
profile-cond=get("video-params/max-luma") > 203
profile-restore=copy
target-peak=auto
target-colorspace-hint=auto
blend-subtitles=no
deband=no

[pgs-fix]
profile-desc=宽银幕电影内封 PGS 字幕画幅比例错位修复
profile-cond=get("video-params/aspect") > 16 / 9
profile-restore=copy
stretch-image-subs-to-screen=yes

##############
# 窗口状态组 #
##############
# 根据窗口状态自动调整界面行为，提升多任务体验

[pause]
profile-desc=暂停时取消置顶，恢复播放时自动重新置顶
profile-cond=pause
profile-restore=copy
ontop=no

[maximized]
profile-desc=最大化时禁用自动调整窗口，防止切换文件时窗口跳动
profile-cond=window_maximized and vid and not get("current-tracks/video/albumart")
profile-restore=copy-equal
auto-window-resize=no

[end]
profile-desc=播放结束时退出全屏和最大化，方便选择下一文件
profile-cond=idle_active
no-fullscreen
no-window-maximized
