### 文档_ https://github.com/hooke007/MPV_lazy/blob/main/portable_config/profiles.conf

##############
# 平台配置组 #
##############
# 根据操作系统自动切换视频输出（vo）、图形 API、音频输出（ao）和 IPC 通信方式
# Windows: 自动选择 API，wasapi 音频，named pipe 通信
# Linux: vulkan + Wayland，pipewire 音频，/tmp socket 通信
# macOS: vulkan（ARM）或 auto（Intel），coreaudio 音频

[Win]
profile-cond=platform == "win32"
profile-restore=copy
vo=gpu-next
gpu-api=auto
ao=wasapi
input-ipc-server="mpvsocket"
snap-window=yes

[Linux]
profile-cond=platform == "linux"
profile-restore=copy
vo=gpu-next
gpu-context=waylandvk
gpu-api=vulkan
vulkan-async-transfer=yes
vulkan-async-compute=yes
hwdec=vulkan,nvdec,no
hwdec-codecs=h264,hevc,vp8,vp9,av1
ao=pipewire
input-ipc-server="/tmp/mpvsocket"

[Macos-Arm]
profile-cond=platform == "darwin" and os.exec("uname -m") == "arm64"
profile-restore=copy
vo=gpu-next
gpu-api=vulkan
ao=coreaudio
input-ipc-server="/tmp/mpvsocket"

[Macos-Intel]
profile-cond=platform == "darwin" and os.exec("uname -m") == "x86_64"
profile-restore=copy
vo=gpu-next
gpu-api=auto
ao=coreaudio
input-ipc-server="/tmp/mpvsocket"

##############
# 播放控制组 #
##############
# 根据播放状态动态调整参数，无需手动干预

[Speed-Limit1]
profile-desc=防止快捷键误触导致播放速度低于 0.1
profile-cond=p.speed<0.1
speed=0.1

[Speed-Limit2]
profile-desc=防止快捷键误触导致播放速度超过 8 倍
profile-cond=p.speed>8
speed=8

## https://github.com/mpv-player/mpv/issues/11122
[Vsync-Auto]
profile-desc=高帧率或变速时切换为音频同步，避免 display-resample 卡顿
profile-cond=p.container_fps>32 or (p.display_fps/p.container_fps)>3.2 or p.speed~=1
profile-restore=copy
interpolation=no
video-sync=audio

[Save-Props-Auto]
profile-desc=短片、图片、纯音频不记录进度，避免污染历史记录
profile-cond=p.percent_pos>=90 or p.duration<=300 or not vid or p["current-tracks/video/albumart"] or p["current-tracks/video/image"]
profile-restore=copy
save-position-on-quit=no

##############
# 画质条件组 #
##############
# 根据视频内容特征自动优化画质，无需手动切换

[SD]
profile-desc=720p 及以下启用超分辨率（需配合 glsl-shaders）
profile-cond=height <= 720 or width <= 720
profile-restore=copy
profile=Shader-Fsrcnnx+

[Deband]
profile-desc=色深不足时启用去色带，8k 视频自动禁用
profile-cond=get("video-params/average-bpp") < 24 and not (get("video-params/w") > 7000 or get("video-params/h") > 3000)
profile-restore=copy
deband=yes

[HDR]
profile-desc=检测 HDR 内容后自动配置色调映射和色彩空间直通
profile-cond=get("video-params/max-luma") > 203
profile-restore=copy
target-peak=auto
target-colorspace-hint=auto
blend-subtitles=no
deband=no

[Pgs-Fix]
profile-desc=宽银幕电影内封 PGS 字幕画幅比例错位修复
profile-cond=get("video-params/aspect") > 16 / 9
profile-restore=copy
stretch-image-subs-to-screen=yes

##############
# 窗口状态组 #
##############
# 根据窗口状态自动调整界面行为，提升多任务体验

[Pause]
profile-desc=暂停时取消置顶，恢复播放时自动重新置顶
profile-cond=pause
profile-restore=copy
ontop=no

[Maximized]
profile-desc=最大化时禁用自动调整窗口，防止切换文件时窗口跳动
profile-cond=window_maximized and vid and not get("current-tracks/video/albumart")
profile-restore=copy-equal
auto-window-resize=no

[End]
profile-desc=播放结束时退出全屏和最大化，方便选择下一文件
profile-cond=idle_active
no-fullscreen
no-window-maximized

[Minimized]
profile-desc=最小化时暂停播放
profile-cond=window_minimized and vid and not get("current-tracks/video/albumart")
profile-restore=copy-equal
pause

[Media-Title]
profile-desc=网络流切换窗口标题显示内容
profile-cond=path:find('://') ~= nil or path:find('^magnet:') ~= nil
profile-restore=copy
title=${?pause==yes:⏸}${?mute==yes:🔇}${?ontop==yes:📌}${media-title}
osd-playlist-entry=title

[Peak-Percentile]
profile-desc=低平均亮度内容降低峰值百分位，避免亮度跳动
profile-cond=get("video-params/avg-pq-y") < 0.21 and p.current_vo == "gpu-next"
profile-restore=copy
hdr-peak-percentile=99.8

[Sdr-Gamut]
profile-desc=SDR 内容的色域映射，非 bt.709 色域启用 clip
profile-cond=get("video-params/primaries") ~= "bt.709" and get("video-params/gamma") == "bt.1886"
profile-restore=copy
gamut-mapping-mode=clip

##############
# 画质配置组 #
##############
# 手动触发的画质预设，通过快捷键调用 apply-profile 触发

## 高质量缩放（ewa_lanczossharp 质量最高，性能开销较大）
[HQ]
profile-desc=高质量缩放：ewa_lanczossharp + bilinear cscale + lanczos dscale
scale=ewa_lanczossharp
cscale=bilinear
dscale=lanczos
scale-antiring=0.5
dscale-antiring=0.5
linear-upscaling=no
sigmoid-upscaling=yes
correct-downscaling=yes
linear-downscaling=no
deband=no

## 去色带多级预设（手动选择，配合 Deband 条件配置使用）
[Deband-Low]
profile-desc=去色带 low：轻度去色带，适合大多数场景
deband-iterations=1
deband-threshold=48
deband-range=16
deband-grain=16

[Deband-Medium]
profile-desc=去色带 medium：中度去色带，适合明显色带
deband-iterations=2
deband-threshold=64
deband-range=16
deband-grain=24

[Deband-High]
profile-desc=去色带 high：强力去色带，适合严重色带
deband-iterations=3
deband-threshold=64
deband-range=16
deband-grain=24

## 抖动配置（色深抖动，减少色彩断层）
[Dither]
profile-desc=色深抖动：fruit 算法，平衡质量与性能
dither-depth=auto
dither=fruit
dither-size-fruit=6

[Dither+]
profile-desc=色深抖动：error-diffusion，最高质量
dither-depth=auto
dither=error-diffusion
error-diffusion=floyd-steinberg

## HDR 色调映射配置
[Hdr2Sdr]
profile-desc=HDR 转 SDR 色调映射参数
tone-mapping=auto
gamut-mapping-mode=auto
hdr-contrast-recovery=0.30
hdr-compute-peak=auto
hdr-peak-percentile=99.995
hdr-peak-decay-rate=20
hdr-scene-threshold-low=1.0
hdr-scene-threshold-high=3.0
allow-delayed-peak-detect=no

##############
# 着色器预设 #
##############
# 手动应用的着色器组合，通过快捷键调用 apply-profile 触发

## 清空
[Shader-Clear]
profile-desc=清空所有着色器
glsl-shaders=

## A4K 组合（重建+放大+降采样）
[Shader-A4k-Mode-A]
profile-desc=Anime4K Mode A: 重建 + 放大 + 自动降采样
glsl-shaders=~~/shaders/Anime4K/glsl/Restore/Anime4K_Clamp_Highlights.glsl;~~/shaders/Anime4K/glsl/Restore/Anime4K_Restore_CNN_M.glsl;~~/shaders/Anime4K/glsl/Upscale/Anime4K_Upscale_CNN_x2_M.glsl;~~/shaders/Anime4K/glsl/Upscale/Anime4K_AutoDownscalePre_x2.glsl;~~/shaders/Anime4K/glsl/Upscale/Anime4K_AutoDownscalePre_x4.glsl;~~/shaders/Anime4K/glsl/Upscale/Anime4K_Upscale_CNN_x2_S.glsl

[Shader-A4k-Mode-B]
profile-desc=Anime4K Mode B: 柔和重建 + 放大 + 自动降采样
glsl-shaders=~~/shaders/Anime4K/glsl/Restore/Anime4K_Clamp_Highlights.glsl;~~/shaders/Anime4K/glsl/Restore/Anime4K_Restore_CNN_Soft_M.glsl;~~/shaders/Anime4K/glsl/Upscale/Anime4K_Upscale_CNN_x2_M.glsl;~~/shaders/Anime4K/glsl/Upscale/Anime4K_AutoDownscalePre_x2.glsl;~~/shaders/Anime4K/glsl/Upscale/Anime4K_AutoDownscalePre_x4.glsl;~~/shaders/Anime4K/glsl/Upscale/Anime4K_Upscale_CNN_x2_S.glsl

[Shader-A4k-Dtdd]
profile-desc=Anime4K DTDD: 暗部增强 + 线条细化 + 降噪 + 去模糊
glsl-shaders=~~/shaders/Anime4K/glsl/Experimental-Effects/Anime4K_Darken_HQ.glsl;~~/shaders/Anime4K/glsl/Experimental-Effects/Anime4K_Thin_HQ.glsl;~~/shaders/Anime4K/glsl/Denoise/Anime4K_Denoise_Bilateral_Mode.glsl;~~/shaders/Anime4K/glsl/Deblur/Anime4K_Deblur_DoG.glsl

## 通用 upscale（质量优先）
[Shader-Nnedi3]
profile-desc=NNEDI3 32-win8x4: 通用 upscale，质量优先
glsl-shaders=~~/shaders/nnedi3/nnedi3-nns32-win8x4.glsl;~~/shaders/igv/SSimDownscaler.glsl

[Shader-Nnedi3+]
profile-desc=NNEDI3 64-win8x4: 通用 upscale，最高质量
glsl-shaders=~~/shaders/nnedi3/nnedi3-nns64-win8x4.glsl;~~/shaders/igv/SSimDownscaler.glsl

[Shader-Ravu-Zoom]
profile-desc=RAVU Zoom AR r3: 通用 upscale，平衡质量与性能
glsl-shaders=~~/shaders/ravu/ravu-zoom-ar-r3.glsl;~~/shaders/igv/SSimDownscaler.glsl

## HD/SD 放大
[Shader-Fsrcnnx]
profile-desc=FSRCNNX x2: HD 内容放大，细节增强
glsl-shaders=~~/shaders/igv/FSRCNNX_x2_8-0-4-1.glsl;~~/shaders/igv/SSimDownscaler.glsl

[Shader-Fsrcnnx+]
profile-desc=FSRCNNX x1 distort: SD 内容放大，抗锯齿
glsl-shaders=~~/shaders/igv/FSRCNNX_x1_16-0-4-1_distort.glsl;~~/shaders/igv/SSimDownscaler.glsl

## 动画专用
[Shader-Animejanai]
profile-desc=AnimeJaNai V3L1 HD x2: 动画放大，轻量级
glsl-shaders=~~/shaders/AnimeJaNai/AnimeJaNaiV3L1_HD_x2.glsl;~~/shaders/igv/SSimDownscaler.glsl

[Shader-Ani4k]
profile-desc=Ani4K v2 ArtCNN: 动画放大，ArtCNN 色彩处理
glsl-shaders=~~/shaders/Ani4k/Ani4Kv2_ArtCNN_C4F32_i2.glsl;~~/shaders/igv/SSimDownscaler.glsl

[Shader-Anisd]
profile-desc=AniSD ArtCNN: SD 动画专用放大
glsl-shaders=~~/shaders/Ani4k/AniSD_ArtCNN_C4F32_i4.glsl;~~/shaders/igv/SSimDownscaler.glsl

## 后处理
[Shader-Anime4k]
profile-desc=Anime4K Restore Soft: 动画后处理，色彩空间处理
glsl-shaders=~~/shaders/igv/KrigBilateral.glsl;~~/shaders/Anime4K/glsl/Restore/Anime4K_Restore_CNN_Soft_M.glsl;~~/shaders/Anime4K/glsl/Restore/Anime4K_Clamp_Highlights.glsl;~~/shaders/igv/SSimDownscaler.glsl

[Shader-Ssim]
profile-desc=SSimSuperRes: 4K 低性能设备，轻量后处理
glsl-shaders=~~/shaders/igv/SSimSuperRes.glsl;~~/shaders/igv/SSimDownscaler.glsl
