### 行首如果存在注释符号 "#" 则说明该项 "未启用"
### 文档: https://github.com/hooke007/MPV_lazy/blob/main/portable_config/mpv.conf
### 注意：当前预设下，选项 --volume 的关联属性已被全局追踪记录，移除缓存文件 saved-props.json 才能使其的更改生效

########
# 基础 #
########
# 输入映射、配置文件引入、元数据编码等全局基础设置

input-conf = "~~/input_uosc.conf"
include = "~~/profiles.conf"
metadata-codepage = auto
#use-filedir-conf = yes
#include = "~~/script-opts.conf"
#log-file = "~~desktop/mpv-lazy.log"

########
# 窗口 #
########
# 窗口外观（无标题栏、圆角）、尺寸限制、DPI 缩放等界面行为

title = ${?pause==yes:⏸}${?mute==yes:🔇}${?ontop==yes:📌}${?demuxer-via-network==yes:${media-title}}${?demuxer-via-network==no:${filename}}
no-title-bar
border = no
autofit-smaller = 50%x50%
autofit-larger = 70%x70%
keepaspect-window = yes
hidpi-window-scale = no

########
# OSD #
########
# 屏幕显示样式：字体、颜色、进度条外观、跳转时显示的信息

osd-on-seek=msg
osd-bar-w=100
osd-bar-h=2
osd-bar-align-y=-1
osd-font="Noto Sans Mono CJK SC"
osd-font-size=24
osd-color="#FFFFFF"
osd-outline-size=1.0
osd-outline-color="#1C1B1F"
osd-shadow-offset=0
osd-back-color="#1C1B1F"
osd-border-style=outline-and-shadow
osd-playlist-entry=filename
osd-status-msg=${playback-time/full} / ${duration/full} (${percent-pos}%)\nframe: ${estimated-frame-number} / ${estimated-frame-count}
osd-fractions=yes
osd-duration=2000

########
# 播放 #
########
# 空闲行为、精确跳转、目录打开方式、文件类型过滤

idle = yes
keep-open = yes
#pause = yes
hr-seek = yes
hr-seek-framedrop = no
directory-mode = ignore
#autocreate-playlist = same
#directory-filter-types = video,audio
#video-exts = avi,flv,m2ts,mkv,mov,mp4,ts,wmv
#image-exts = avif,bmp,jpeg,jpg,jxl,png,webp
#audio-exts = aiff,ape,flac,mp3,ogg,opus,wav

########
# 记录 #
########
# 退出时保存播放进度、播放历史，切换文件时重置之前的调整项

save-position-on-quit = yes
write-filename-in-watch-later-config
resume-playback-check-mtime = yes
watch-later-options = start,vid,aid,sid
watch-later-dir = "~~/_cache/watch_later"
#save-watch-history = yes
#watch-history-path = "~~/_cache/watch_history.jsonl"
reset-on-next-file = vid,aid,sid,secondary-sid,vf,af,loop-file,deinterlace,contrast,brightness,gamma,saturation,hue,video-zoom,video-rotate,video-pan-x,video-pan-y,panscan,speed,audio-delay,sub-pos,sub-scale,sub-delay,sub-speed,sub-visibility,secondary-sub-visibility

########
# 输入 #
########
# IME 输入法、内置快捷键、IPC 通信（平台相关已移至 profiles.conf）

input-ime = no
input-builtin-bindings = no
# input-ipc-server 已移至 profiles.conf（[win] 使用 named pipe，[linux]/[macos-arm] 使用 /tmp）

########
# 音频 #
########
# 音量、声道、音轨语言优先级、音频设备选择

volume = 80
volume-max = 130
audio-channels = stereo
audio-buffer = 0.2
alang = jpn,eng,chs,sc,zh-cn,chi,zh,zh-tw,cht,zho,ze
slang = chs,sc,zh-cn,chi,zh,zh-tw,cht,zho,ze
audio-file-auto = fuzzy
#audio-device = "wasapi/{xxxxxxxx-xxxx-xxxx-xxxx-xxxxxxxxxxxx}"
#audio-exclusive = yes
#audio-spdif = ac3,dts

########
# 视频 #
########
# 平台特定设置（vo/gpu-api/hwdec）已移至 profiles.conf
# 以下为视频渲染管线：同步方式、缩放算法、色彩管理、后处理、HDR 映射

## 同步 —— display-resample 减少掉帧，变速时自动切换音频同步
video-sync = display-resample
#video-sync-max-video-change = 5
interpolation = yes
tscale = oversample

## 缩放 —— 默认 spline36 平衡质量与性能，高质量缩放通过 profiles.conf [HQ] 手动触发
cscale = spline36
scale = spline36
dscale = mitchell
scale-antiring = 0.5
dscale-antiring = 0
linear-upscaling = yes
sigmoid-upscaling = yes
correct-downscaling = yes
linear-downscaling = yes

## 色彩 —— ICC 自动校色、色彩空间直通（HDR 信号传递给显示器）
icc-profile-auto = no
target-colorspace-hint = no
#target-prim = display-p3
#target-trc = gamma2.2

## 后处理 —— 自动去交错，色深抖动默认开启
deinterlace = auto
deband = no
dither = fruit
dither-depth = auto
dither-size-fruit = 6
blend-subtitles = no

## HDR —— hable 色调映射保留高光细节，peak-percentile 99.99 忽略极端像素
tone-mapping = auto
gamut-mapping-mode = auto
hdr-compute-peak = auto
hdr-peak-percentile = 99.99
target-peak = auto

########
# 字幕 #
########
# 字幕搜索、编码、字体渲染、ASS 样式覆盖、图形字幕处理

## 基础 —— 自动匹配字幕文件，支持中文编码
sub-auto = fuzzy
sub-file-paths = sub;subtitles
sub-codepage = GB18030
subs-fallback = yes

## 字体与渲染 —— Noto Sans CJK 确保中文显示，蓝色描边提高可读性
sub-font = "Noto Sans CJK SC Regular"
sub-font-size = 45
sub-scale-signs = yes
sub-outline-size = 2
sub-outline-color = "#5d93b7"
sub-blur = 0
sub-color = "#ffffffff"
sub-use-margins = yes
#sub-scale-with-window = no
#sub-back-color = "#FFBF00"
#sub-shadow-offset = 2

## ASS 样式覆盖 —— 禁用 ASS 样式解析，强制使用自定义字体和排版
sub-ass-override = no
sub-ass-style-overrides = Fontname="Noto Sans CJK SC Regular",Alignment=2,Fontsize=45,LineSpacing=0.8,Outline=1.2,Shadow=1,PrimaryColor=&H00FFFFFF&,SecondaryColor=&H000000FF&,OutlineColor=&H000D0E73&,BackColor=&H000D0E73&
sub-ass-force-margins = yes
#sub-ass-video-aspect-override = 16:9

## 图形字幕（IDX/SUB/SUP）—— 不拉伸到全屏，保持原始画幅比例
stretch-image-subs-to-screen = no
image-subs-video-resolution = yes
#image-subs-hdr-peak = sdr

########
# 脚本 #
########
# OSC 界面禁用（使用 uosc 替代）、ytdl 网络下载、着色器加载

osc = no
ytdl-raw-options-append = cookies-from-browser=brave:~/.config/BraveSoftware/Brave-Origin/Default
ytdl-raw-options-append = sub-langs=-danmaku
#vf-append = format=gamma=gamma2.2
#load-stats-overlay = no
#load-scripts = no
#glsl-shaders-append = "~~/shaders/AMD_FSR_EASU_rgb_RT.glsl"
load-context-menu = yes
input-default-bindings = no

########
# 缓存 #
########
# 网络流缓冲区大小、ICC/着色器缓存目录

cache = auto
# demuxer-max-bytes / demuxer-max-back-bytes 已移至 profiles.conf [Network-Stream]
icc-cache-dir = "~~/_cache/icc"
gpu-shader-cache-dir = "~~/_cache/shader"
#vd-lavc-dr = yes  # 默认 auto，低端 GPU 自动禁用
#icc-cache = no
#gpu-shader-cache = no

########
# 截图 #
########
# 截图保存路径、格式（webp 无损）、质量参数

screenshot-template = '~/Pictures/mpv/%tY-%tm-%td_%tH-%tM-%tS'
screenshot-format = webp
screenshot-high-bit-depth = yes
screenshot-tag-colorspace = yes
screenshot-png-compression = 8
screenshot-png-filter = 5
screenshot-webp-lossless = yes
screenshot-webp-compression = 6
screenshot-jpeg-quality = 100
screenshot-jpeg-source-chroma = yes
screenshot-jxl-distance = 0 # 0 代表数学无损
screenshot-jxl-effort = 9 # 1-9，9最高
